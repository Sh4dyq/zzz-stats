<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nexus Stats — Сетки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;--card:#161618;--panel-2:#1c1c20;--panel-3:#242429;
    --border:#26262c;--line:rgba(255,255,255,.07);
    --red:#ff1f44;--pink:#ec1862;--grad:linear-gradient(95deg,#ff1f44,#ec1862);
    --gold:#f5c842;--lime:#c4f500;--purple:#a970ff;
    --text:#f3f3f5;--sub:#8a8a93;--win:#46d369;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh}
  a{text-decoration:none;color:inherit}
  .facets{position:fixed;inset:0;z-index:0;pointer-events:none}
  .topstripe{height:4px;background:var(--grad);position:sticky;top:0;z-index:50}
  body>*:not(.facets){position:relative;z-index:1}
  .disp{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--card)}
  ::-webkit-scrollbar-thumb{background:#34343b;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--red)}

  /* ===== header (shared shell) ===== */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(11,11,13,.72);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .mk{height:42px;width:auto;display:block}
  .brand .wm{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:25px;letter-spacing:.02em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.16em}
  .brand .suf{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:25px;color:#fff;text-transform:uppercase;margin-left:-4px}
  .nav{display:flex;align-items:center;gap:2px;flex-shrink:0;margin-left:6px}
  @media (max-width:980px){.nav{display:none}}
  .nav a{position:relative;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:var(--sub);padding:8px 15px;transition:.15s}
  .nav a:hover{color:var(--text)}
  .nav a.active{color:#fff}
  .nav a.active::after{content:"";position:absolute;left:15px;right:15px;bottom:-2px;height:3px;border-radius:3px;background:var(--grad)}
  .livetw{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;background:rgba(145,70,255,.12);border:1px solid rgba(145,70,255,.4);font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.04em;color:#fff;transition:.15s}
  .livetw:hover{background:rgba(145,70,255,.22)}
  .livetw .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,31,68,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,31,68,.5)}70%{box-shadow:0 0 0 7px rgba(255,31,68,0)}100%{box-shadow:0 0 0 0 rgba(255,31,68,0)}}
  .livetw svg{width:17px;height:17px;fill:var(--purple)}
  .livetw .tw{color:var(--purple)}.livetw .vbar{width:1px;height:18px;background:rgba(255,255,255,.18)}
  .livetw.offline .dot{background:#5e5e66;box-shadow:none;animation:none}
  /* hornybox mini button — высота как у twitch-пилюли */
  .hbbtn{display:flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--border);transition:.15s;flex-shrink:0}
  .hbbtn:hover{border-color:var(--lime)}
  .hbbtn img{height:20px;width:auto;display:block;mix-blend-mode:lighten;flex-shrink:0}

  /* ===== in-page navigation: «Все сетки» (left) + активный турнир (right) ===== */
  .tourrow{position:relative;z-index:40;display:flex;align-items:stretch;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(16,16,20,.55)}
  /* «Все сетки» index button */
  .all-btn{position:relative;display:flex;align-items:center;gap:11px;border:none;background:none;padding:0 24px;cursor:pointer;transition:.15s;min-height:58px}
  .all-btn .ab-ic{width:18px;height:18px;color:var(--sub);transition:.15s}
  .all-btn .ab-tx{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:var(--sub);transition:.15s}
  .all-btn:hover .ab-ic,.all-btn:hover .ab-tx{color:var(--text)}
  .all-btn.active .ab-tx,.all-btn.active .ab-ic{color:#fff}
  .all-btn.active::after{content:"";position:absolute;left:24px;right:24px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
  /* active-tournament tab on the right */
  .tourrow .spacer{flex:1}
  .tour-tab{position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;border:none;border-left:1px solid var(--line);background:none;padding:11px 24px;cursor:default;text-align:right;min-height:58px;white-space:nowrap}
  .tour-tab .tt-main{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:#fff;line-height:1}
  .tour-tab .tt-sub{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#ff7587;line-height:1.1}
  .tour-tab .tt-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;font-style:normal;font-family:'Saira Condensed',sans-serif;margin-left:8px;vertical-align:middle}
  .tt-badge.live{color:var(--red)}.tt-badge.upcoming{color:var(--lime)}.tt-badge.finished{color:var(--sub)}

  /* ===== «Все сетки» — tournaments index table (Challonge-style) ===== */
  .idx-wrap{max-width:1320px;margin:26px auto;padding:0 28px}
  .idx-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:30px;margin-bottom:4px}
  .idx-sub{color:var(--sub);font-size:14px;font-weight:500;margin-bottom:22px}
  .idx-tbl{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--card)}
  .idx-head,.idx-row{display:grid;grid-template-columns:minmax(260px,2.8fr) minmax(150px,1.3fr) .6fr .9fr 1.3fr;align-items:center;gap:16px;padding:14px 22px}
  .idx-head{background:#101013;border-bottom:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
  .idx-row{border-top:1px solid var(--line);cursor:pointer;transition:.12s}
  .idx-row:first-child{border-top:none}
  .idx-row:hover{background:#1a1a1f}
  .idx-row .ir-name{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:23px;color:#fff;display:flex;align-items:center;gap:12px;line-height:1.05}
  .idx-row .ir-thumb{width:36px;height:36px;border-radius:8px;background:linear-gradient(150deg,#2a2a31,#17171b);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:13px;letter-spacing:.02em;background-clip:padding-box;color:#9a9aa3}
  .idx-row:hover .ir-thumb{border-color:#3a3a44}
  .idx-row .ir-thumb img{width:100%;height:100%;object-fit:cover}
  .idx-row.live-row .ir-thumb{background:linear-gradient(150deg,rgba(255,31,68,.28),rgba(236,24,98,.08));border-color:rgba(255,31,68,.35);color:#ff9aa8}
  .idx-cell{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;color:var(--text)}
  .idx-cell.mut{color:var(--sub);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
  .gtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub)}
  .fmt-pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);white-space:normal;line-height:1.35}
  .st-pill{display:inline-flex;align-items:center;gap:6px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.03em;padding:4px 11px;border-radius:7px}
  .st-pill .sdot{width:7px;height:7px;border-radius:50%}
  .st-live{background:rgba(255,31,68,.13);color:#ff7587}.st-live .sdot{background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.8)}
  .st-upcoming{background:rgba(196,245,0,.1);color:var(--lime)}.st-upcoming .sdot{background:var(--lime)}
  .st-finished{background:var(--panel-2);color:var(--sub)}.st-finished .sdot{background:#5e5e66}
  @media (max-width:760px){
    .idx-wrap{padding:0 16px;margin:18px auto}
    .idx-h{font-size:25px}
    .idx-head{display:none}
    .idx-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px 12px;padding:15px 16px}
    .idx-row .ir-name{flex:1 1 100%;min-width:0;font-size:16px;order:0}
    .idx-row .idx-cell:nth-child(2){order:1}                    /* формат */
    .idx-row .idx-cell:nth-child(3){order:2}                    /* участники */
    .idx-row .idx-cell:nth-child(3)::after{content:' уч.';color:#5e5e66}
    .idx-row .idx-cell:nth-child(4){order:3}                    /* дата */
    .idx-row .idx-cell:nth-child(5){order:4;flex:1 1 100%}      /* прогресс на всю строку */
  }

  /* progress bar (index column + tournament meta) */
  .prog{display:flex;align-items:center;gap:9px}
  .prog .bar{position:relative;flex:1;height:7px;border-radius:5px;background:var(--panel-3);overflow:hidden;min-width:56px}
  .prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--grad);transition:width .4s ease}
  .prog .pln{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);min-width:46px;text-align:right;white-space:nowrap}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.85);margin-left:8px;flex-shrink:0;vertical-align:middle}

  /* «текущий турнир» quick-button рядом с «Все сетки» (через разделитель) */
  .tr-div{align-self:center;width:1px;height:26px;background:var(--line);margin:0 4px}
  .cur-btn{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:0 18px;min-height:58px;transition:.15s}
  .cur-btn .cb-dot{width:8px;height:8px;border-radius:50%;background:#5e5e66;flex-shrink:0}
  .cur-btn .cb-dot.on{background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.85)}
  .cur-btn .cb-tx{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.02em;color:var(--sub);transition:.15s;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur-btn:hover .cb-tx{color:#fff}

  /* match review cards (вкладка Результаты, 4 в ряд) */
  .rev-wrap{max-width:1680px;margin:30px auto 10px;padding:0 28px}
  .rev-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:20px;margin-bottom:14px;color:var(--text)}
  .rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
  @media(max-width:900px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.rev-grid{grid-template-columns:1fr}}
  .rev-card{background:linear-gradient(180deg,#1d1d22,#161618 70%);border:1px solid var(--border);border-radius:11px;padding:11px 13px;transition:border-color .15s}
  .rev-card:hover{border-color:#3a3a44}
  .rev-stage{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--sub);margin-bottom:8px}
  .rev-row{display:flex;align-items:center;gap:8px;padding:5px 0}
  .rev-row+.rev-row{border-top:1px solid var(--line)}
  .rev-row .rev-nm{flex:1;font-weight:600;font-size:14px;color:#9a9aa3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rev-row.win .rev-nm{color:#fff;font-weight:700}
  .rev-row .rev-w{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(70,211,105,.16);color:var(--win);font-size:12px;font-weight:700}
  /* stat block (сыгранные матчи встречи) */
  /* шапка: ники крупно, по бокам от итоговых таймеров встречи (всё по центру, не в углах) */
  .rev-hd{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
  .rev-hd .rt-nm{font-size:17px;font-weight:700;color:#9a9aa3;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .rev-hd .rt-nm.w{color:#ff3b6b}
  .rev-sum{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:var(--sub);flex-shrink:0}
  .rev-tot.win{color:#ff3b6b}
  .rev-arr{color:#ff3b6b;font-weight:900;font-family:'Saira Condensed',sans-serif;font-style:italic;padding:0 1px}
  .rev-diff{display:inline-flex;align-items:center;gap:3px;color:#c9c9d0;font-weight:600}
  /* матч: ряд иконок (оба игрока на одном уровне), под ним ряд таймеров+рестартов, разница по центру */
  .rev-m{padding:9px 0}
  .rev-m+.rev-m{border-top:1px solid var(--line)}
  .rev-irow,.rev-srow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
  .rev-srow{margin-top:7px}
  .rev-side{display:flex;align-items:center;gap:6px;min-width:0}
  .rev-irow .rev-side{justify-content:flex-end}
  .rev-irow .rev-side.r{justify-content:flex-start}
  .rev-srow .rev-side{justify-content:flex-end}
  .rev-srow .rev-side.r{justify-content:flex-start}
  .rev-ics{display:grid;grid-template-columns:repeat(3,36px);gap:4px}
  .rev-side.r .rev-ics{justify-items:end}
  .rev-mid{display:flex;align-items:center;justify-content:center;min-width:56px;flex-shrink:0}
  .rev-tmr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sub)}
  .rev-tmr.win{color:#ff3b6b}
  .rbs{display:inline-flex;gap:2px;flex-shrink:0}
  .rb{width:3px;height:12px;background:#3a3a42;transform:skewX(-18deg);border-radius:1px}
  .rb.on{background:#f0902a}

  /* format sub-tabs (Сетка / Результаты) */
  .fmtrow{display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(11,11,13,.4)}
  .fmtrow[hidden]{display:none}
  .fmt-btn{border:none;background:none;position:relative;padding:13px 20px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:18px;font-weight:800;text-transform:uppercase;color:var(--sub);cursor:pointer;transition:.15s;letter-spacing:.02em}
  .fmt-btn:hover{color:var(--text)}
  .fmt-btn.active{color:#fff}
  .fmt-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}

  /* tournament meta strip */
  .tmeta{display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding:16px 28px;border-bottom:1px solid var(--border)}
  .tmeta .tname{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:30px;line-height:.9}
  .tmeta .chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);padding:5px 11px;border:1px solid var(--border);border-radius:7px;display:inline-flex;align-items:center;gap:7px}
  .tmeta .chip b{color:var(--text);font-weight:600}
  .tmeta .ch-link{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em;padding:9px 16px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);transition:.15s}
  .tmeta .ch-link:hover{border-color:var(--red)}

  /* ===== bracket canvas ===== */
  .bracket-wrap{position:relative;overflow:auto;padding:26px 28px 50px;-webkit-overflow-scrolling:touch}
  svg.gflink{inset:0 auto auto 0;width:auto;height:auto}
  /* DE: верхняя+нижняя сетки слева (стопкой), грандфинал — отдельной колонкой справа,
     по вертикали между финалами обеих сеток */
  .de-grid{display:flex;align-items:stretch;gap:90px;min-width:min-content}
  .de-left{display:flex;flex-direction:column;min-width:min-content}
  /* грандфинал: заголовок раунда на уровне шапок раундов верхней сетки (margin-top =
     высота секц.заголовка), матч центрируется по вертикали; подчёркивание шапки
     продлеваем влево через зазор к верхней сетке */
  .de-gf{display:flex;flex-direction:column;min-width:206px;flex-shrink:0;margin-top:44px}
  .de-gf .gf-hdr{position:relative;color:var(--gold);border-color:rgba(245,200,66,.3)}
  .de-gf .gf-hdr::before{content:"";position:absolute;right:100%;width:90px;bottom:0;border-top:1px solid var(--line)}
  .de-gf .gf-body{flex:1;display:flex;align-items:center;justify-content:center}
  .de-gf .gf-body .match{position:relative;top:auto!important;left:auto;right:auto;width:206px;border-color:rgba(245,200,66,.28)}
  .bsec-title{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.05em;color:var(--sub);margin:6px 0 14px;display:flex;align-items:center;gap:10px}
  .bsec-title::after{content:"";flex:1;height:1px;background:var(--border)}
  .bsec-title.upper{color:#ff7587}.bsec-title.lower{color:var(--purple)}.bsec-title.gf{color:var(--gold)}

  .bracket{display:flex;gap:48px;align-items:flex-start;min-width:min-content;padding-bottom:8px;position:relative}
  .bround{display:flex;flex-direction:column;min-width:206px}
  .bcol{position:relative;width:100%}
  .bround-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--sub);padding:0 0 9px;margin-bottom:6px;text-align:center;border-bottom:1px solid var(--line)}

  /* match card (абсолютно позиционируется внутри .bcol по рассчитанному top) */
  .match{position:absolute;left:0;right:0;z-index:1;background:linear-gradient(180deg,#1d1d22,#161618 70%);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
  /* Challonge-style match identifier (порядковый номер встречи слева от карточки) */
  .match .m-id{position:absolute;left:-23px;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:#4d4d55;width:20px;text-align:center;pointer-events:none}
  .match:hover{border-color:#43434d;box-shadow:0 6px 20px -8px rgba(0,0,0,.7);z-index:2}
  .match .seed{position:relative;display:flex;align-items:center;gap:8px;padding:0 10px;min-height:23px}
  .match .seed+.seed{border-top:1px solid var(--line)}
  .seed .sd{font-family:'JetBrains Mono',monospace;font-size:9px;color:#7a7a85;width:18px;flex-shrink:0;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border-right:1px solid var(--line);margin:0 3px 0 -10px}
  .seed.win .sd{color:#fff;background:rgba(255,31,68,.12)}
  .seed .av{width:19px;height:19px;border-radius:5px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:9px;font-weight:900;color:var(--sub);flex-shrink:0;overflow:hidden}
  .seed .av img{width:100%;height:100%;object-fit:cover;display:block}

<script>
const SB_URL='https://zoavnckfbfiejxfjakue.supabase.co';
const SB_KEY='sb_publishable_37RZBsmdp3O1i795EuEfeg_vFpdPTFZ';
const sb=supabase.createClient(SB_URL,SB_KEY);

const S={tours:[],players:{},encounters:[],results:{},parts:{},cache:{},charMap:{},matchesByEnc:{},cur:null,fmt:'bracket',view:'all'};
const GAME='Zenless Zone Zero';
const fmtDate=d=>d?new Date(d).toLocaleDateString('ru',{day:'2-digit',month:'short',year:'numeric'}):'—';
// дата в формате 02.06 (день.месяц)
const fmtDM=d=>{const x=new Date(d);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0');};
// диапазон дат проведения (event_date .. event_date_end) → «02.06 - 03.06»
const fmtRange=t=>{
  if(!t.event_date)return'—';
  return t.event_date_end&&t.event_date_end!==t.event_date?`${fmtDM(t.event_date)} - ${fmtDM(t.event_date_end)}`:fmtDM(t.event_date);
};
// полные названия форматов; поддержка многоэтапных через «->»/«→» (Round Robin → Double Elimination)
const FMT_FULL={SE:'Single Elimination',DE:'Double Elimination',GROUPS:'Round Robin',RR:'Round Robin',ROUNDROBIN:'Round Robin',SWISS:'Swiss'};
const fmtFull=t=>{
  const raw=(t.bracket_type||'').trim();
  if(!raw)return'—';
  return raw.split(/\s*(?:->|→|>)\s*/).map(p=>FMT_FULL[p.toUpperCase().replace(/[\s_]/g,'')]||p).join(' → ');
};
// подсветка «Nexus Shiyu» в названии нашим (малиновым) цветом
const hlName=name=>esc(name).replace(/(nexus\s*shiyu)/i,'<span style="color:var(--pink)">$1</span>');
// участники: из tournament_participants (по сеянию), иначе уникальные из встреч
const seedsOf=tid=>(S.parts[tid]||[]).slice().sort((a,b)=>(a.seed||1e9)-(b.seed||1e9)).map(p=>S.players[p.player_id]).filter(Boolean);
const partCount=tid=>{const sd=(S.parts[tid]||[]).length;if(sd)return sd;const s=new Set();S.encounters.filter(e=>e.tournament_id==tid).forEach(e=>{if(e.player1_id)s.add(e.player1_id);if(e.player2_id)s.add(e.player2_id)});return s.size};
// максимально возможное число матчей турнира по формату и числу участников
const maxMatches=t=>{const n=Math.max(partCount(t.id),t.expected_players||0);if(n<2)return 0;return t.bracket_type==='DE'?2*(n-1):n-1;};
// прогресс турнира. done (1-е число) = матчи, УЖЕ ЗАКРЫТЫЕ в сетке — включая
// тех-лузы и проходы без отдельной встречи (матч с проставленным победителем
// считается сыгранным). total (2-е) = все матчи сетки по её структуре и числу
// игроков. Приоритет источника: СВОЯ сетка (узлы, без BYE) → кэш Challonge
// (авторитетен: walkover/bye там уже закрыты) → структурный максимум по формату.
const prg=(done,total)=>({done,total,pct:total?Math.round(done/total*100):0});
const tourProgress=tid=>{
  const t=S.tours.find(x=>x.id==tid)||{};
  const nodes=S.nodes&&S.nodes[tid];
  if(nodes&&nodes.length){
    const real=nodes.filter(n=>!n.is_bye);           // BYE — не матч; тех-лузы (winner без встречи) считаются
    const done=real.filter(n=>n.winner_id).length;
    return prg(done,real.length||done);
  }
  const ch=S.cache[tid];
  if(ch&&Array.isArray(ch.rounds)&&ch.rounds.length){
    let total=0,done=0;
    ch.rounds.forEach(r=>(r.matches||[]).forEach(m=>{total++;if(m.played)done++;}));
    if(total)return prg(done,total);
  }
  const e=S.encounters.filter(x=>x.tournament_id==tid);
  const done=e.filter(x=>x.winner_id).length;
  return prg(done,Math.max(maxMatches(t),e.length,done));
};
const progHTML=pr=>`<div class="prog"><div class="bar"><div class="fill" style="width:${pr.pct}%"></div></div><span class="pln">${pr.done}/${pr.total}</span></div>`;
// актуальный турнир: live → последний не-анонс → первый
const curTour=()=>S.tours.find(t=>t.status==='live')||S.tours.find(t=>t.status!=='upcoming')||S.tours[0]||null;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// фолбэк фото игрока по форматам: webp → png → jpg, иначе показываем инициалы
function imgFallback(img){const ex=['webp','png','jpg'];const cur=(img.src.split('.').pop()||'').toLowerCase();const i=ex.indexOf(cur);if(i>=0&&i<ex.length-1){img.src=img.src.replace(/\.[^.]+$/,'.'+ex[i+1]);}else img.remove();}

// ---- challonge link normalization (ready for proxy/iframe fallback) ----
function challongeSlug(url){
  if(!url) return null;
  const m=String(url).match(/challonge\.com\/(?:[a-z]{2}\/)?([A-Za-z0-9_]+)/);
  return m?m[1]:String(url).replace(/^.*\//,'');
}

async function boot(){
  const [ts,ps,es,rs,pa,bc,ch,mt,br,bn]=await Promise.all([
    sb.from('tournaments').select('*').order('created_at',{ascending:false}),
    sb.from('players').select('id,nickname'),
    sb.from('encounters').select('*'),
    sb.from('tournament_results').select('*').then(r=>r,()=>({data:[]})),
    sb.from('tournament_participants').select('*').then(r=>r,()=>({data:[]})),
    sb.from('bracket_cache').select('*').then(r=>r,()=>({data:[]})),
    sb.from('characters').select('id,name,role,element,rarity,icon_url,portrait_url').then(r=>r,()=>({data:[]})),
    sb.from('matches').select('*,picks:match_picks(*)').then(r=>r,()=>({data:[]})),
    sb.from('brackets').select('*').then(r=>r,()=>({data:[]})),
    sb.from('bracket_nodes').select('*').then(r=>r,()=>({data:[]}))
  ]);
  // порядок как в админке: ручной sort_order поверх created_at (иначе «актуальный
  // турнир» из curTour() брался по дате создания, а не по закреплённому порядку — и
  // расходился со statistics, где сортировка по sort_order применяется).
  S.tours=(ts.data||[]).slice().sort((a,b)=>(a.sort_order??1e9)-(b.sort_order??1e9));
  (ps.data||[]).forEach(p=>S.players[p.id]=p.nickname);
  S.encounters=es.data||[];
  (rs.data||[]).forEach(r=>{(S.results[r.tournament_id]=S.results[r.tournament_id]||[]).push(r)});
  (pa.data||[]).forEach(p=>{(S.parts[p.tournament_id]=S.parts[p.tournament_id]||[]).push(p)});
  (bc.data||[]).forEach(c=>{S.cache[c.tournament_id]=c.json});
  // своя сетка (Фаза 2): bracket_nodes по турниру через brackets(id→tournament_id)
  S.nodes={};const brTour={};(br.data||[]).forEach(b=>brTour[b.id]=b.tournament_id);
  (bn.data||[]).forEach(n=>{const tid=brTour[n.bracket_id];if(!tid)return;(S.nodes[tid]=S.nodes[tid]||[]).push(n);});
  S.charMap={};(ch.data||[]).forEach(c=>S.charMap[c.id]=c);
  S.matchesByEnc={};(mt.data||[]).forEach(m=>{(S.matchesByEnc[m.encounter_id]=S.matchesByEnc[m.encounter_id]||[]).push(m);});
  renderFmtTabs();
  // deep-link ?tid=<id> (с главной: «полный рейтинг → страница результатов сетки»).
  const wantId=new URLSearchParams(location.search).get('tid');
  const wantT=wantId&&S.tours.find(t=>String(t.id)===String(wantId));
  if(wantT){openTour(wantT);}
  // default landing = «Все сетки» index
  else{S.view='all';S.cur=null;renderTourbar();render();}
}

function openTour(t){S.cur=t;S.view='tour';S.fmt='bracket';
  $('fmtrow').querySelectorAll('.fmt-btn').forEach(x=>x.classList.toggle('active',x.dataset.fmt==='bracket'));
  renderTourbar();render();}
function openAll(){S.view='all';renderTourbar();render();}

// left «Все сетки» + (when inside a tournament) active tournament tab on the right
function renderTourbar(){
  const inTour=S.view==='tour'&&S.cur;
  let right='';
  if(inTour){
    const t=S.cur,st=t.status||'finished';
    const lbl={live:'LIVE',upcoming:'СКОРО',finished:'ЗАВЕРШЁН'}[st]||'';
    // дату показываем только если задана (иначе под бейджем висел «—»)
    const sub=t.event_date?`<span class="tt-sub">${fmtRange(t)}</span>`:'';

// ---- normalized bracket model from encounters (fallback until Challonge proxy) ----
// Groups a tournament's encounters by `stage` into rounds. Challonge proxy will
// later feed the same {rounds:[{name,matches}]} shape — renderRounds stays unchanged.
function modelFromEncounters(t){
  const encs=S.encounters.filter(e=>e.tournament_id==t.id);
  if(!encs.length) return null;
  const byStage={};
  encs.forEach(e=>{const k=e.stage||'Раунд';(byStage[k]=byStage[k]||[]).push(e)});
  const ORDER=['1/8','1/4','1/2','Полуфинал','Финал','Гранд-финал','Нижняя сетка'];
  const keys=Object.keys(byStage).sort((a,b)=>{
    const ia=ORDER.findIndex(o=>a.includes(o)),ib=ORDER.findIndex(o=>b.includes(o));
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  // раунды сырых встреч (в порядке sort_order)
  const er=keys.map(k=>({name:k,encs:byStage[k].slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))}));
  // сквозная нумерация встреч (как на Challonge)
  let id=0;er.forEach(r=>r.encs.forEach(e=>e._mid=++id));
  // фидеры: встреча раунда r питается встречами раунда r-1, чей победитель играет в ней
  // (обычная турнирная логика 2→1; при «bye» у встречи будет 1 фидер)
  er.forEach((r,ri)=>r.encs.forEach(e=>{
    e._fd=[];
    if(ri>0)er[ri-1].encs.forEach(pe=>{if(pe.winner_id&&(pe.winner_id===e.player1_id||pe.winner_id===e.player2_id))e._fd.push(pe._mid);});
  }));
  return {rounds:er.map(r=>({name:r.name,matches:r.encs.map(encMatch)}))};
}
function encMatch(e){
  const n=id=>id?(S.players[id]||'—'):null;
  // score: count match wins within encounter is unknown here → show winner only (Bo2)
  return {
    id:e._mid,feeders:e._fd||[],
    a:{name:n(e.player1_id),win:e.winner_id&&e.winner_id===e.player1_id,seed:''},
    b:{name:n(e.player2_id),win:e.winner_id&&e.winner_id===e.player2_id,seed:''},
    played:!!e.winner_id
  };
}

// своя сетка (движок) → та же модель {rounds:[{name,matches}]}; имена раундов
// совместимы с renderBracketBody (Верхняя/Нижняя/Гранд-финал).
function nodesToModel(t){
  const ns=S.nodes&&S.nodes[t.id];if(!ns||!ns.length)return null;
  const feeders={};ns.forEach(n=>{[n.next_win_node,n.next_lose_node].forEach(tid=>{if(tid)(feeders[tid]=feeders[tid]||[]).push(n.identifier);});});
  const groups={};ns.forEach(n=>{const k=n.part+'|'+n.round;(groups[k]=groups[k]||[]).push(n);});
  const ord={W:0,L:1,GF:2};
  const keys=Object.keys(groups).sort((a,b)=>{const[pa,ra]=a.split('|'),[pb,rb]=b.split('|');return ord[pa]-ord[pb]||(+ra-+rb);});
  const seat=(n,w)=>{const pid=n['player'+w+'_id'];return{name:pid?(S.players[pid]||'—'):(n.is_bye?'BYE':null),win:!!(n.winner_id&&n.winner_id===pid),seed:n['seed'+w]||''};};
  const rounds=keys.map(k=>{
    const[part,round]=k.split('|');
    const ms=groups[k].sort((a,b)=>a.slot-b.slot);
    const name=part==='GF'?'Гранд-финал':part==='L'?('Нижняя '+round):('Верхняя '+round);
    return{name,matches:ms.map(n=>({id:n.identifier,feeders:feeders[n.id]||[],a:seat(n,1),b:seat(n,2),played:!!n.winner_id}))};
  });
  return{rounds};
}
function renderBracket(t){
  const slug=challongeSlug(t.challonge_url);
  // ПРИОРИТЕТ ИСТОЧНИКА: своя сетка (движок) → кэш Challonge → encounters → каркас.
  const own=nodesToModel(t);
  if(own){
    const badge=`<span style="display:inline-block;padding:2px 9px;border-radius:99px;background:linear-gradient(90deg,#7b5bff,#ff3b6b);color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px">СВОЯ СЕТКА</span>`;
    const note=`<div style="max-width:1080px;margin:0 auto;padding:16px 28px 0;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${badge}</div>`;
    $('content').innerHTML=note+`<div class="bracket-wrap">${renderBracketBody(own.rounds,t.bracket_type||'')}</div>`;
    return;
  }
  // ИСТОЧНИК (гибрид): для турниров с challonge_url авторитет сетки = кэш Challonge (синк на бэке),
  // иначе фолбэк на encounters, иначе каркас.
  const ch=S.cache[t.id];
  let src='enc';
  let model=(ch&&Array.isArray(ch.rounds)&&ch.rounds.length)?(src='challonge',{rounds:ch.rounds}):modelFromEncounters(t);
  if(model&&src!=='challonge')src='enc';
  let skeleton=false;
  // нет сохранённых встреч → показываем КАРКАС по формату+числу участников
  if(!model){
    src='skeleton';
    const seeds=seedsOf(t.id);
    const n=Math.max(seeds.length,t.expected_players||0);
    model=(typeof BracketModel!=='undefined')?BracketModel.skeletonModel(t.bracket_type||'SE',n,seeds):null;
    skeleton=!!model;
  }
  if(!model){
    $('content').innerHTML=`<div class="panel">
      <h3>Сетка ещё не готова</h3>
      <p>Укажи формат и число участников турнира, чтобы показать каркас сетки.</p>
      ${slug?`<p>Пока можно открыть оригинал на Challonge:</p>
        <a class="alt" href="https://challonge.com/ru/${slug}" target="_blank" rel="noopener">Challonge / ${esc(slug)} ↗</a>`:''}
    </div>`;
    return;
  }
  const badge=src==='challonge'
    ?`<span style="display:inline-block;padding:2px 9px;border-radius:99px;background:linear-gradient(90deg,#ff3b6b,#ff8a5b);color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px">CHALLONGE · авто-синк${ch.fetched_at?' · '+fmtDate(ch.fetched_at):''}</span>`
    :src==='enc'?`<span style="display:inline-block;padding:2px 9px;border-radius:99px;background:#1a1d27;border:1px solid var(--border);color:var(--sub);font-size:11px;font-weight:600">Ручной ввод</span>`:'';
  const note=(badge||skeleton)?`<div style="max-width:1080px;margin:0 auto;padding:16px 28px 0;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${badge}${skeleton?`<span>Предварительный каркас сетки${seedsOf(t.id).length?' (участники по посеву)':' — участники появятся по мере заполнения'}.</span>`:''}</div>`:'';
  $('content').innerHTML=note+`<div class="bracket-wrap">${renderBracketBody(model.rounds,t.bracket_type||'')}</div>`;
}

// Каркас сетки: для Double Elimination раскладываем горизонтально по секциям
// (Верхняя сетка / Нижняя сетка / Гранд-финал) — как на Challonge и в нашей графике.
// Single Elimination и прочие — одна горизонтальная лента.
function renderBracketBody(rounds, bracketType=''){
  const isLower=n=>/нижн|lower|loser/i.test(n||'');
  const isGf=n=>/гранд|grand|finale/i.test(n||'');
  const hasDE=rounds.some(r=>isLower(r.name)||isGf(r.name));
  if(!hasDE) return renderRounds(rounds);
  const strip=arr=>arr.map(r=>({...r,name:(r.name||'').replace(/^(верхняя|нижняя)\s*·?\s*/i,'').trim()||r.name}));
  const lower=strip(rounds.filter(r=>isLower(r.name)));
  // Нет нижней сетки → это SE (даже если есть раунд «Гранд-финал»): одна лента без заголовка «Верхняя сетка».
  if(!lower.length) return renderRounds(strip(rounds));
  // Гранд-финал выносим в отдельную колонку справа: к нему сходятся линии от финала
  // верхней и финала нижней сетки (связи рисует linkGrandFinal на оверлее .bracket-wrap).
  const gf=strip(rounds.filter(r=>isGf(r.name)));
  const upper=strip(rounds.filter(r=>!isLower(r.name)&&!isGf(r.name)));
  let left='';
  if(upper.length)left+=`<div class="bsec-title upper">Верхняя сетка</div>${renderRounds(upper)}`;
  if(lower.length)left+=`<div class="bsec-title lower">Нижняя сетка</div>${renderRounds(lower)}`;
  if(!gf.length) return left;
  // Гранд-финал: единственная подпись (как название раунда) — в одном ряду с шапками
  // раундов верхней сетки; сам матч центрируется по вертикали (между финалами).
  const gm=gf[0].matches[0]||{a:{name:null},b:{name:null},played:false};
  gm._top=0;if(gm.id==null)gm.id='';
  const gfHtml=`<div class="de-gf">
    <div class="bround-h gf-hdr">Гранд-финал</div>
    <div class="gf-body">${matchHTML(gm)}</div>
  </div>`;
  return `<div class="de-grid"><div class="de-left">${left}</div>${gfHtml}</div>`;
}

// геометрия раскладки: высота карточки + вертикальный зазор (шаг сетки)
const MATCH_H=50,ROW_GAP=20,UNIT=MATCH_H+ROW_GAP;
// Раскладка раундов: каждая встреча вертикально центрируется между своими фидерами
// (обычная турнирная логика 2→1). Если фидеры неизвестны (каркас/Challonge-кэш) —
// равномерное распределение (space-around) по высоте базового раунда.
function layoutRounds(rounds){
  let gid=0;rounds.forEach(r=>r.matches.forEach(m=>{if(m.id==null)m.id=++gid;}));
  const byId={};rounds.forEach(r=>r.matches.forEach(m=>byId[m.id]=m));
  const hasFeeders=rounds.some(r=>r.matches.some(m=>(m.feeders||[]).length));
  if(hasFeeders){
    rounds.forEach((r,ri)=>r.matches.forEach((m,i)=>{
      const fd=(m.feeders||[]).map(id=>byId[id]).filter(x=>x&&x._top!=null);
      m._top=(ri>0&&fd.length)?fd.reduce((s,f)=>s+f._top,0)/fd.length:i*UNIT;
    }));
  }else{
    const base=rounds[0].matches.length||1;const totalH=base*UNIT;
    rounds.forEach(r=>{const n=r.matches.length||1,span=totalH/n;
      r.matches.forEach((m,i)=>{m._top=span*(i+0.5)-MATCH_H/2;});});
  }
  return Math.max(MATCH_H,...rounds.flatMap(r=>r.matches.map(m=>m._top+MATCH_H)));
}
function renderRounds(rounds){
  const h=layoutRounds(rounds);
  return `<div class="bracket">`+rounds.map(r=>`
    <div class="bround">
      <div class="bround-h">${esc(r.name)}</div>
      <div class="bcol" style="height:${Math.ceil(h)}px">${r.matches.map(m=>matchHTML(m)).join('')}</div>
    </div>`).join('')+`</div>`;
}
function matchHTML(m){
  const id=m.id;
  return `<div class="match ${m.played?'played':''}" data-id="${id}" data-feeders="${(m.feeders||[]).join(',')}" style="top:${Math.round(m._top)}px">
    ${id?`<span class="m-id">${id}</span>`:''}
    ${seedHTML(m.a,m.played)}${seedHTML(m.b,m.played)}</div>`;
}
function seedHTML(s,played){
  if(s&&s.bye) return `<div class="seed tbd"><span class="sd"></span><span class="av" style="border-style:none"></span><span class="nm" style="color:#44444c">BYE</span><span class="sc"></span></div>`;
  if(!s||!s.name) return `<div class="seed tbd"><span class="sd"></span><span class="av"></span><span class="nm">TBD</span><span class="sc"></span></div>`;
  // победитель → win; в сыгранной встрече проигравший → серый; иначе (каркас) — нейтрально
  const cls=s.win?'win':(played&&s.name!=='—'?'lose':'');
  const init=(s.name||'?').replace(/[^A-Za-zА-Яа-я0-9$]/g,'').slice(0,2).toUpperCase()||'—';
  const sl=(s.name||'').trim().toLowerCase();
  return `<div class="seed ${cls}">
    <span class="sd">${s.seed||''}</span>
    <span class="av"><img src="web/players/${esc(sl)}.webp" alt="" onerror="imgFallback(this)">${init}</span>
    <span class="nm">${esc(s.name)}</span>
    <span class="sc">${s.win?'✓':''}</span></div>`;
}

// плашки-обзор сыгранных встреч (только добавленные в статистику = с победителем), 4 в ряд.
// Если по встрече есть сыгранные матчи (matches+picks) — показываем стату: суммарные таймеры
// игроков + разница, иконки персонажей, таймер и полоски рестартов по каждому матчу.
function encReviewCards(t){
  const encs=S.encounters.filter(e=>e.tournament_id==t.id&&e.winner_id)
    .sort((a,b)=>(a.sort_order??1e9)-(b.sort_order??1e9));
  if(!encs.length)return'';
  const fmt=s=>`${Math.floor((s||0)/60)}:${String((s||0)%60).padStart(2,'0')}`;
  const tmr=s=>s?fmt(s):'—';
  const bars=n=>{let h='';for(let i=0;i<4;i++)h+=`<span class="rb${i<(n||0)?' on':''}"></span>`;return`<span class="rbs">${h}</span>`;};
  const ics=(m,pid)=>(m.picks||[]).filter(p=>String(p.player_id)===String(pid))
    .map(p=>iconChar(S.charMap[p.character_id]||null,36)).join('');
  const simple=(name,win)=>`<div class="rev-row ${win?'win':''}"><span class="rev-nm">${esc(name||'—')}</span>${win?'<span class="rev-w">✓</span>':''}</div>`;
  let e0;
  // разница таймеров со стрелкой на победителя: «<» — левый (p1), «>» — правый (p2)
  const diff=(t1,t2,winId)=>{
    const aL=winId===e0.player1_id?'<span class="rev-arr">&lt;</span>':'';
    const aR=winId===e0.player2_id?'<span class="rev-arr">&gt;</span>':'';
    return`<span class="rev-diff">${aL}Δ ${fmt(Math.abs((t1||0)-(t2||0)))}${aR}</span>`;
  };
  const card=e=>{
    e0=e;
    const w1=e.winner_id===e.player1_id,w2=e.winner_id===e.player2_id;
    const p1n=S.players[e.player1_id],p2n=S.players[e.player2_id];
    const ms=(S.matchesByEnc[e.id]||[]).slice().sort((a,b)=>(a.match_number||0)-(b.match_number||0));
    let body;
    if(ms.length){
      let s1=0,s2=0;ms.forEach(m=>{s1+=m.player1_timer_sec||0;s2+=m.player2_timer_sec||0;});
      // матч: верхний ряд — иконки обоих игроков на одном уровне; нижний — таймеры+рестарты, разница по центру
      const rows=ms.map(m=>{
        const tw1=m.winner_id===e.player1_id,tw2=m.winner_id===e.player2_id;
        return`<div class="rev-m">
        <div class="rev-irow">
          <div class="rev-side"><span class="rev-ics">${ics(m,e.player1_id)}</span></div>
          <div class="rev-mid"></div>
          <div class="rev-side r"><span class="rev-ics">${ics(m,e.player2_id)}</span></div>
        </div>
        <div class="rev-srow">
          <div class="rev-side"><span class="rev-tmr${tw1?' win':''}">${tmr(m.player1_timer_sec)}</span>${bars(m.player1_restarts)}</div>
          <div class="rev-mid">${diff(m.player1_timer_sec,m.player2_timer_sec,m.winner_id)}</div>
          <div class="rev-side r">${bars(m.player2_restarts)}<span class="rev-tmr${tw2?' win':''}">${tmr(m.player2_timer_sec)}</span></div>
        </div>
      </div>`;}).join('');
      body=`<div class="rev-hd">
          <span class="rt-nm${w1?' w':''}">${esc(p1n||'—')}</span>
          <span class="rev-sum"><span class="rev-tot${w1?' win':''}">${fmt(s1)}</span>${diff(s1,s2,e.winner_id)}<span class="rev-tot${w2?' win':''}">${fmt(s2)}</span></span>
          <span class="rt-nm r${w2?' w':''}">${esc(p2n||'—')}</span>
        </div>
        ${rows}`;
    }else{
      body=simple(p1n,w1)+simple(p2n,w2);
    }
    return`<div class="rev-card">${e.stage?`<div class="rev-stage">${esc(e.stage)}</div>`:''}${body}</div>`;
  };
  return`<div class="rev-wrap">
    <div class="rev-h">Обзор встреч</div>
    <div class="rev-grid">${encs.map(card).join('')}</div>
  </div>`;
}
// «Обзор встреч» — отдельная вкладка ПЕРЕД результатами (плашки сыгранных встреч).
function renderReview(t){
  const cards=encReviewCards(t);
  $('content').innerHTML=cards||`<div class="panel"><h3>Обзор встреч пуст</h3>
    <p>Здесь появятся сыгранные встречи с таймерами и пиками, как только их добавят в статистику.</p></div>`;
}
function renderResults(t){
  const rs=(S.results[t.id]||[]).slice().sort((a,b)=>(a.place||99)-(b.place||99));
  if(!rs.length){
    $('content').innerHTML=`<div class="panel"><h3>Результаты не заполнены</h3>
      <p>Места и призовые появятся после завершения турнира — их подтянет синк с Challonge (final_rank) или ручной ввод в админке.</p></div>`;
    return;
  }
  $('content').innerHTML=`<div class="rtbl">`+rs.map(r=>{
    const g=r.place<=3?'g'+r.place:'';
    const nm=S.players[r.player_id]||'—';
    const init=(nm||'?').replace(/[^A-Za-zА-Яа-я0-9$]/g,'').slice(0,2).toUpperCase()||'—';
    const sl=(nm||'').trim().toLowerCase();
    return `<div class="rrow ${g}">
      <span class="plc ${g}">${r.place||'—'}</span>
      <span class="rav"><img src="web/players/${esc(sl)}.webp" alt="" onerror="imgFallback(this)">${init}</span>
      <span class="rnm">${esc(nm)}</span>
      ${r.prize?`<span class="rprz">${Number(r.prize).toLocaleString('ru')} ₽</span>`:''}</div>`;
  }).join('')+`</div>`;
}

// ===== bracket connectors + state nodes (additive overlay — observes render output,
//        does NOT modify renderRounds/modelFromEncounters/boot) =====
(function(){
  const NS='http://www.w3.org/2000/svg';
  const rc=(el,base)=>{const r=el.getBoundingClientRect();return{l:r.left-base.left,r:r.right-base.left,cy:(r.top+r.bottom)/2-base.top};};
  const mstate=m=>m.classList.contains('played')?'done':(m.querySelector('.seed.tbd')?'future':'live');
  function diamond(x,y,st){const s=6.5,p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M${x} ${y-s}L${x+s} ${y}L${x} ${y+s}L${x-s} ${y}Z`);
    p.setAttribute('class','node '+st);return p;}
  function tagRounds(rounds){
    rounds.forEach(r=>{
      const h=r.querySelector('.bround-h'),t=((h&&h.textContent)||'').trim().toLowerCase();
      r.classList.remove('br-lower','br-gf');
      if(/нижн|lower|loser/.test(t))r.classList.add('br-lower');
      else if(/гранд|grand|finale/.test(t)||t==='финал')r.classList.add('br-gf');
    });
  }
  function paintOne(br){
    br.querySelectorAll(':scope > svg.bconn').forEach(s=>s.remove());
    const rounds=[...br.querySelectorAll(':scope > .bround')];
    if(!rounds.length)return;
    tagRounds(rounds);
    const base=br.getBoundingClientRect();
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','bconn');
    const mcol=r=>[...(r.querySelector('.bcol')||r).querySelectorAll(':scope > .match')];
    const mr=rounds.map(mcol);
    const lastIdx=rounds.length-1;
    const all=mr.flat();
    const byId={};all.forEach(m=>byId[m.dataset.id]=m);
    const hasFeeders=all.some(m=>m.dataset.feeders);
    const link=(f,m)=>{const a=rc(f,base),b=rc(m,base),midx=a.r+(b.l-a.r)/2;
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',`M${a.r} ${a.cy}H${midx}V${b.cy}H${b.l}`);
      p.setAttribute('class','link'+(mstate(f)==='future'?' dim':''));svg.appendChild(p);};
    if(hasFeeders){
      // обычная турнирная логика: тянем связи строго по фидерам (2→1)
      const parent=new Set();
      all.forEach(m=>{(m.dataset.feeders||'').split(',').filter(Boolean).forEach(fid=>{
        const f=byId[fid];if(!f)return;parent.add(fid);link(f,m);});});
      all.forEach(m=>{const a=rc(m,base),st=mstate(m);
        if((m.dataset.feeders||'').split(',').filter(Boolean).length)svg.appendChild(diamond(a.l,a.cy,st));
        if(parent.has(m.dataset.id))svg.appendChild(diamond(a.r,a.cy,st));});
    }else{
      // фолбэк (каркас/Challonge-кэш без явных фидеров): эвристика по индексам
      for(let ri=0;ri<lastIdx;ri++){
        const cur=mr[ri],nxt=mr[ri+1];
        if(!cur.length||!nxt.length)continue;
        cur.forEach((m,i)=>{
          let ti;
          if(nxt.length===cur.length)ti=i;
          else if(nxt.length===Math.ceil(cur.length/2))ti=Math.floor(i/2);
          else ti=Math.min(nxt.length-1,Math.floor(i*nxt.length/cur.length));
          const tgt=nxt[ti];if(tgt)link(m,tgt);
        });
      }
      mr.forEach((arr,ri)=>arr.forEach(m=>{
        const a=rc(m,base),st=mstate(m);
        if(ri<lastIdx)svg.appendChild(diamond(a.r,a.cy,st));
        if(ri>0)svg.appendChild(diamond(a.l,a.cy,st));
      }));
    }
    br.prepend(svg);
    // legend (once per bracket-wrap, only when there are connections to explain)
    const wrap=br.closest('.bracket-wrap');
    if(rounds.length>1&&wrap&&!wrap.querySelector('.blegend')){
      const lg=document.createElement('div');lg.className='blegend';
      lg.innerHTML='<span><i class="done"></i>матч завершён</span><span><i class="live"></i>активный матч</span><span><i class="future"></i>будущий матч</span>';
      wrap.appendChild(lg);
    }
  }
  // DE: грандфинал — отдельная колонка справа (.de-gf). Тянем связи от финала верхней
  // и финала нижней сетки: оба выхода сводятся на общую вертикаль (шину) слева от
  // грандфинала, откуда одна линия входит в него.
  function bracketAfter(title){let el=title&&title.nextElementSibling;while(el&&!(el.classList&&el.classList.contains('bracket')))el=el.nextElementSibling;return el;}
  function lastMatch(br){const rs=br?[...br.querySelectorAll('.bround')]:[];return rs.length?[...rs[rs.length-1].querySelectorAll('.match')].pop():null;}
  function linkGrandFinal(wrap){
    wrap.querySelectorAll(':scope > svg.gflink').forEach(s=>s.remove());
    const gfM=wrap.querySelector('.de-gf .match');
    const upF=lastMatch(bracketAfter(wrap.querySelector('.bsec-title.upper')));
    const loF=lastMatch(bracketAfter(wrap.querySelector('.bsec-title.lower')));
    if(!gfM||!upF||!loF)return;
    const base=wrap.getBoundingClientRect();
    const off=el=>{const r=el.getBoundingClientRect();return{l:r.left-base.left+wrap.scrollLeft,r:r.right-base.left+wrap.scrollLeft,cy:(r.top+r.bottom)/2-base.top+wrap.scrollTop};};
    const u=off(upF),l=off(loF),g=off(gfM);
    const busX=g.l-30;
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','bconn gflink');
    svg.style.width=wrap.scrollWidth+'px';svg.style.height=wrap.scrollHeight+'px';
    const path=(d,dim)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','link'+(dim?' dim':''));svg.appendChild(p);};
    path(`M${u.r} ${u.cy}H${busX}`,mstate(upF)==='future');
    path(`M${l.r} ${l.cy}H${busX}`,mstate(loF)==='future');
    path(`M${busX} ${u.cy}V${l.cy}`,mstate(upF)==='future'&&mstate(loF)==='future');
    path(`M${busX} ${g.cy}H${g.l}`,mstate(gfM)==='future');
    svg.appendChild(diamond(u.r,u.cy,mstate(upF)));
    svg.appendChild(diamond(l.r,l.cy,mstate(loF)));
    svg.appendChild(diamond(g.l,g.cy,mstate(gfM)));
    wrap.appendChild(svg);
  }
  let busy=false;
  function paint(){busy=true;document.querySelectorAll('.bracket').forEach(paintOne);
    document.querySelectorAll('.bracket-wrap').forEach(linkGrandFinal);busy=false;}
  let t;const schedule=()=>{clearTimeout(t);t=setTimeout(paint,60);};
  const c=document.getElementById('content');
  if(c)new MutationObserver(()=>{if(!busy)schedule();}).observe(c,{childList:true});
  window.addEventListener('resize',schedule);
  window.addEventListener('load',schedule);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
})();

boot().catch(e=>{console.error(e);$('content').innerHTML='<div class="panel"><h3>Ошибка загрузки</h3><p>'+esc(e.message)+'</p></div>';});
</script>
