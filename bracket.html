<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nexus Stats — Сетки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;--card:#161618;--panel-2:#1c1c20;--panel-3:#242429;
    --border:#26262c;--line:rgba(255,255,255,.07);
    --red:#ff1f44;--pink:#ec1862;--grad:linear-gradient(95deg,#ff1f44,#ec1862);
    --gold:#f5c842;--lime:#c4f500;--purple:#a970ff;
    --text:#f3f3f5;--sub:#8a8a93;--win:#46d369;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh}
  a{text-decoration:none;color:inherit}
  .facets{position:fixed;inset:0;z-index:0;pointer-events:none}
  .topstripe{height:4px;background:var(--grad);position:sticky;top:0;z-index:50}
  body>*:not(.facets){position:relative;z-index:1}
  .disp{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--card)}
  ::-webkit-scrollbar-thumb{background:#34343b;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--red)}

  /* ===== header (shared shell) ===== */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(11,11,13,.72);backdrop-filter:blur(12px)}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .mk{height:42px;width:auto;display:block}
  .brand .wm{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:25px;letter-spacing:.02em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.16em}
  .brand .suf{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:25px;color:#fff;text-transform:uppercase;margin-left:-4px}
  .nav{display:flex;align-items:center;gap:2px;flex-shrink:0;margin-left:6px}
  @media (max-width:980px){.nav{display:none}}
  .nav a{position:relative;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:var(--sub);padding:8px 15px;transition:.15s}
  .nav a:hover{color:var(--text)}
  .nav a.active{color:#fff}
  .nav a.active::after{content:"";position:absolute;left:15px;right:15px;bottom:-2px;height:3px;border-radius:3px;background:var(--grad)}
  .livetw{display:flex;align-items:center;gap:10px;padding:9px 16px;border-radius:10px;background:rgba(145,70,255,.12);border:1px solid rgba(145,70,255,.4);font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.04em;color:#fff;transition:.15s}
  .livetw:hover{background:rgba(145,70,255,.22)}
  .livetw .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,31,68,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,31,68,.5)}70%{box-shadow:0 0 0 7px rgba(255,31,68,0)}100%{box-shadow:0 0 0 0 rgba(255,31,68,0)}}
  .livetw svg{width:17px;height:17px;fill:var(--purple)}
  .livetw .tw{color:var(--purple)}.livetw .vbar{width:1px;height:18px;background:rgba(255,255,255,.18)}
  .livetw.offline .dot{background:#5e5e66;box-shadow:none;animation:none}

  /* ===== in-page navigation: «Все сетки» (left) + активный турнир (right) ===== */
  .tourrow{position:relative;z-index:40;display:flex;align-items:stretch;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(16,16,20,.55)}
  /* «Все сетки» index button */
  .all-btn{position:relative;display:flex;align-items:center;gap:11px;border:none;background:none;padding:0 24px;cursor:pointer;transition:.15s;min-height:58px}
  .all-btn .ab-ic{width:18px;height:18px;color:var(--sub);transition:.15s}
  .all-btn .ab-tx{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:var(--sub);transition:.15s}
  .all-btn:hover .ab-ic,.all-btn:hover .ab-tx{color:var(--text)}
  .all-btn.active .ab-tx,.all-btn.active .ab-ic{color:#fff}
  .all-btn.active::after{content:"";position:absolute;left:24px;right:24px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
  /* active-tournament tab on the right */
  .tourrow .spacer{flex:1}
  .tour-tab{position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;border:none;border-left:1px solid var(--line);background:none;padding:11px 24px;cursor:default;text-align:right;min-height:58px;white-space:nowrap}
  .tour-tab .tt-main{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.02em;color:#fff;line-height:1}
  .tour-tab .tt-sub{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#ff7587;line-height:1.1}
  .tour-tab .tt-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;font-style:normal;font-family:'Saira Condensed',sans-serif;margin-left:8px;vertical-align:middle}
  .tt-badge.live{color:var(--red)}.tt-badge.upcoming{color:var(--lime)}.tt-badge.finished{color:var(--sub)}

  /* ===== «Все сетки» — tournaments index table (Challonge-style) ===== */
  .idx-wrap{max-width:1080px;margin:26px auto;padding:0 28px}
  .idx-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:30px;margin-bottom:4px}
  .idx-sub{color:var(--sub);font-size:14px;font-weight:500;margin-bottom:22px}
  .idx-tbl{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:var(--card)}
  .idx-head,.idx-row{display:grid;grid-template-columns:minmax(200px,2.4fr) .8fr .7fr 1fr 1.4fr;align-items:center;gap:14px;padding:13px 20px}
  .idx-head{background:#101013;border-bottom:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
  .idx-row{border-top:1px solid var(--line);cursor:pointer;transition:.12s}
  .idx-row:first-child{border-top:none}
  .idx-row:hover{background:#1a1a1f}
  .idx-row .ir-name{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:18px;color:#fff;display:flex;align-items:center;gap:10px;line-height:1}
  .idx-row .ir-thumb{width:36px;height:36px;border-radius:8px;background:linear-gradient(150deg,#2a2a31,#17171b);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:13px;letter-spacing:.02em;background-clip:padding-box;color:#9a9aa3}
  .idx-row:hover .ir-thumb{border-color:#3a3a44}
  .idx-row .ir-thumb img{width:100%;height:100%;object-fit:cover}
  .idx-row.live-row .ir-thumb{background:linear-gradient(150deg,rgba(255,31,68,.28),rgba(236,24,98,.08));border-color:rgba(255,31,68,.35);color:#ff9aa8}
  .idx-cell{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;color:var(--text)}
  .idx-cell.mut{color:var(--sub);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500}
  .gtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--sub)}
  .fmt-pill{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);color:var(--text)}
  .st-pill{display:inline-flex;align-items:center;gap:6px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.03em;padding:4px 11px;border-radius:7px}
  .st-pill .sdot{width:7px;height:7px;border-radius:50%}
  .st-live{background:rgba(255,31,68,.13);color:#ff7587}.st-live .sdot{background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.8)}
  .st-upcoming{background:rgba(196,245,0,.1);color:var(--lime)}.st-upcoming .sdot{background:var(--lime)}
  .st-finished{background:var(--panel-2);color:var(--sub)}.st-finished .sdot{background:#5e5e66}
  @media (max-width:760px){
    .idx-wrap{padding:0 16px;margin:18px auto}
    .idx-h{font-size:25px}
    .idx-head{display:none}
    .idx-row{display:flex;flex-wrap:wrap;align-items:center;gap:9px 12px;padding:15px 16px}
    .idx-row .ir-name{flex:1 1 100%;min-width:0;font-size:16px;order:0}
    .idx-row .idx-cell:nth-child(2){order:1}                    /* формат */
    .idx-row .idx-cell:nth-child(3){order:2}                    /* участники */
    .idx-row .idx-cell:nth-child(3)::after{content:' уч.';color:#5e5e66}
    .idx-row .idx-cell:nth-child(4){order:3}                    /* дата */
    .idx-row .idx-cell:nth-child(5){order:4;flex:1 1 100%}      /* прогресс на всю строку */
  }

  /* progress bar (index column + tournament meta) */
  .prog{display:flex;align-items:center;gap:9px}
  .prog .bar{position:relative;flex:1;height:7px;border-radius:5px;background:var(--panel-3);overflow:hidden;min-width:56px}
  .prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--grad);transition:width .4s ease}
  .prog .pln{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);min-width:46px;text-align:right;white-space:nowrap}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.85);margin-left:8px;flex-shrink:0;vertical-align:middle}

  /* «текущий турнир» quick-button рядом с «Все сетки» (через разделитель) */
  .tr-div{align-self:center;width:1px;height:26px;background:var(--line);margin:0 4px}
  .cur-btn{display:flex;align-items:center;gap:9px;border:none;background:none;cursor:pointer;padding:0 18px;min-height:58px;transition:.15s}
  .cur-btn .cb-dot{width:8px;height:8px;border-radius:50%;background:#5e5e66;flex-shrink:0}
  .cur-btn .cb-dot.on{background:var(--red);box-shadow:0 0 7px rgba(255,31,68,.85)}
  .cur-btn .cb-tx{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.02em;color:var(--sub);transition:.15s;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cur-btn:hover .cb-tx{color:#fff}

  /* match review cards (вкладка Результаты, 4 в ряд) */
  .rev-wrap{max-width:1080px;margin:30px auto 10px;padding:0 28px}
  .rev-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:20px;margin-bottom:14px;color:var(--text)}
  .rev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:900px){.rev-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.rev-grid{grid-template-columns:1fr}}
  .rev-card{background:linear-gradient(180deg,#1d1d22,#161618 70%);border:1px solid var(--border);border-radius:11px;padding:11px 13px;transition:border-color .15s}
  .rev-card:hover{border-color:#3a3a44}
  .rev-stage{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.04em;color:var(--sub);margin-bottom:8px}
  .rev-row{display:flex;align-items:center;gap:8px;padding:5px 0}
  .rev-row+.rev-row{border-top:1px solid var(--line)}
  .rev-row .rev-nm{flex:1;font-weight:600;font-size:14px;color:#9a9aa3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rev-row.win .rev-nm{color:#fff;font-weight:700}
  .rev-row .rev-w{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(70,211,105,.16);color:var(--win);font-size:12px;font-weight:700}

  /* format sub-tabs (Сетка / Результаты) */
  .fmtrow{display:flex;gap:0;padding:0 24px;border-bottom:1px solid var(--border);background:rgba(11,11,13,.4)}
  .fmtrow[hidden]{display:none}
  .fmt-btn{border:none;background:none;position:relative;padding:13px 20px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:18px;font-weight:800;text-transform:uppercase;color:var(--sub);cursor:pointer;transition:.15s;letter-spacing:.02em}
  .fmt-btn:hover{color:var(--text)}
  .fmt-btn.active{color:#fff}
  .fmt-btn.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}

  /* tournament meta strip */
  .tmeta{display:flex;align-items:center;flex-wrap:wrap;gap:18px;padding:16px 28px;border-bottom:1px solid var(--border)}
  .tmeta .tname{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:30px;line-height:.9}
  .tmeta .chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);padding:5px 11px;border:1px solid var(--border);border-radius:7px;display:inline-flex;align-items:center;gap:7px}
  .tmeta .chip b{color:var(--text);font-weight:600}
  .tmeta .ch-link{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em;padding:9px 16px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);transition:.15s}
  .tmeta .ch-link:hover{border-color:var(--red)}

  /* ===== bracket canvas ===== */
  .bracket-wrap{overflow:auto;padding:26px 28px 50px;-webkit-overflow-scrolling:touch}
  .bsec-title{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.05em;color:var(--sub);margin:6px 0 14px;display:flex;align-items:center;gap:10px}
  .bsec-title::after{content:"";flex:1;height:1px;background:var(--border)}
  .bsec-title.upper{color:#ff7587}.bsec-title.lower{color:var(--purple)}.bsec-title.gf{color:var(--gold)}

  .bracket{display:flex;gap:54px;align-items:flex-start;min-width:min-content;padding-bottom:8px}
  .bround{display:flex;flex-direction:column;justify-content:space-around;gap:24px;min-width:228px}
  .bround-h{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--sub);padding:0 0 10px;margin-bottom:2px;text-align:center;border-bottom:1px solid var(--line)}

  /* match card */
  .match{position:relative;z-index:1;background:linear-gradient(180deg,#1d1d22,#161618 70%);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}
  /* Challonge-style match identifier (порядковый номер встречи слева от карточки) */
  .match .m-id{position:absolute;left:-26px;top:50%;transform:translateY(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;color:#4d4d55;width:22px;text-align:center;pointer-events:none}
  .match:hover{border-color:#43434d;transform:translateY(-1px);box-shadow:0 6px 20px -8px rgba(0,0,0,.7)}
  .match .seed{position:relative;display:flex;align-items:center;gap:10px;padding:0 13px;min-height:46px}
  .match .seed+.seed{border-top:1px solid var(--line)}
  .seed .sd{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7a7a85;width:22px;flex-shrink:0;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03);border-right:1px solid var(--line);margin:0 4px 0 -13px}
  .seed.win .sd{color:#fff;background:rgba(255,31,68,.12)}
  .seed .av{width:26px;height:26px;border-radius:7px;background:var(--panel-3);display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:11px;font-weight:900;color:var(--sub);flex-shrink:0;overflow:hidden}
  .seed .av img{width:100%;height:100%;object-fit:cover;display:block}
  .seed .nm{font-weight:600;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d0;letter-spacing:.01em}
  .seed .sc{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px;color:var(--sub);min-width:18px;text-align:right}
  /* winner row */
  .seed.win{background:linear-gradient(90deg,rgba(255,31,68,.09),rgba(236,24,98,0) 62%)}
  .seed.win .nm{color:#fff;font-weight:700}
  .seed.win .av{color:#fff}
  .seed.win::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
  /* win checkmark badge */
  .seed.win .sc{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;min-width:19px;border-radius:50%;background:rgba(70,211,105,.16);color:var(--win);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;line-height:1}
  .seed.lose .nm{color:#6d6d76}.seed.lose .sc{color:#5a5a62}
  .seed.lose .av{opacity:.55}
  .seed.tbd .nm{color:#4d4d55;font-style:italic;font-weight:500}
  .seed.tbd .av{background:transparent;border:1px dashed #34343b}
  .match.played{border-color:#2f2f37;box-shadow:0 0 0 1px rgba(255,31,68,.10),0 4px 16px -10px rgba(255,31,68,.25)}
  .match.played:hover{box-shadow:0 0 0 1px rgba(255,31,68,.2),0 8px 22px -10px rgba(255,31,68,.35)}

  /* ===== connectors (SVG overlay painted over .bracket) ===== */
  .bracket{position:relative}
  svg.bconn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
  svg.bconn path.link{fill:none;stroke:#43434e;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  svg.bconn path.link.dim{stroke:#2a2a31}
  /* state nodes (diamonds): done=white · live=red glow · future=red outline */
  svg.bconn .node{stroke-width:1.6}
  svg.bconn .node.done{fill:#e9e9ee;stroke:#e9e9ee}
  svg.bconn .node.future{fill:var(--bg);stroke:#ff1f44}
  svg.bconn .node.live{fill:#ff1f44;stroke:#ff8094;filter:drop-shadow(0 0 5px rgba(255,31,68,.85))}
  @media (prefers-reduced-motion:no-preference){svg.bconn .node.live{animation:nodepulse 1.7s ease-in-out infinite}}
  @keyframes nodepulse{0%,100%{opacity:1}50%{opacity:.5}}
  /* legend (mirrors official bracket graphic) */
  .blegend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;color:var(--sub)}
  .blegend span{display:inline-flex;align-items:center;gap:9px}
  .blegend i{width:10px;height:10px;transform:rotate(45deg);display:inline-block;flex-shrink:0}
  .blegend i.done{background:#e9e9ee}
  .blegend i.live{background:#ff1f44;box-shadow:0 0 7px rgba(255,31,68,.85)}
  .blegend i.future{background:var(--bg);box-shadow:inset 0 0 0 1.6px #ff1f44}
  /* DE column tints (tagged by post-process from round header text) */
  .bround.br-lower .bround-h{color:var(--purple);border-color:rgba(169,112,255,.25)}
  .bround.br-gf .bround-h{color:var(--gold);border-color:rgba(245,200,66,.3)}
  .bround.br-gf .match{border-color:rgba(245,200,66,.28)}

  /* states */
  .panel{max-width:560px;margin:60px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:34px 30px;text-align:center}
  .panel h3{font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:24px;margin-bottom:10px}
  .panel p{color:var(--sub);font-size:15px;font-weight:500;line-height:1.5;margin-bottom:8px}
  .panel .alt{margin-top:18px;display:inline-flex;gap:8px;align-items:center;padding:11px 20px;border-radius:9px;background:var(--grad);color:#fff;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.03em}

<script>
const SB_URL='https://zoavnckfbfiejxfjakue.supabase.co';
const SB_KEY='sb_publishable_37RZBsmdp3O1i795EuEfeg_vFpdPTFZ';
const sb=supabase.createClient(SB_URL,SB_KEY);

const S={tours:[],players:{},encounters:[],results:{},parts:{},cache:{},cur:null,fmt:'bracket',view:'all'};
const GAME='Zenless Zone Zero';
const fmtDate=d=>d?new Date(d).toLocaleDateString('ru',{day:'2-digit',month:'short',year:'numeric'}):'—';
// диапазон дат проведения (event_date .. event_date_end)
const fmtRange=t=>{
  if(!t.event_date)return'—';
  const sd=x=>new Date(x).toLocaleDateString('ru',{day:'2-digit',month:'short'});
  return t.event_date_end&&t.event_date_end!==t.event_date?`${sd(t.event_date)} – ${fmtDate(t.event_date_end)}`:fmtDate(t.event_date);
};
// участники: из tournament_participants (по сеянию), иначе уникальные из встреч
const seedsOf=tid=>(S.parts[tid]||[]).slice().sort((a,b)=>(a.seed||1e9)-(b.seed||1e9)).map(p=>S.players[p.player_id]).filter(Boolean);
const partCount=tid=>{const sd=(S.parts[tid]||[]).length;if(sd)return sd;const s=new Set();S.encounters.filter(e=>e.tournament_id==tid).forEach(e=>{if(e.player1_id)s.add(e.player1_id);if(e.player2_id)s.add(e.player2_id)});return s.size};
// прогресс турнира = доля сыгранных встреч (с победителем) от всех
const tourProgress=tid=>{const e=S.encounters.filter(x=>x.tournament_id==tid);const total=e.length,done=e.filter(x=>x.winner_id).length;return{done,total,pct:total?Math.round(done/total*100):0};};
const progHTML=pr=>`<div class="prog"><div class="bar"><div class="fill" style="width:${pr.pct}%"></div></div><span class="pln">${pr.done}/${pr.total}</span></div>`;
// актуальный турнир: live → последний не-анонс → первый
const curTour=()=>S.tours.find(t=>t.status==='live')||S.tours.find(t=>t.status!=='upcoming')||S.tours[0]||null;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- challonge link normalization (ready for proxy/iframe fallback) ----
function challongeSlug(url){
  if(!url) return null;
  const m=String(url).match(/challonge\.com\/(?:[a-z]{2}\/)?([A-Za-z0-9_]+)/);
  return m?m[1]:String(url).replace(/^.*\//,'');
}

async function boot(){
  const [ts,ps,es,rs,pa,bc]=await Promise.all([
    sb.from('tournaments').select('*').order('created_at',{ascending:false}),
    sb.from('players').select('id,nickname'),
    sb.from('encounters').select('*'),
    sb.from('tournament_results').select('*').then(r=>r,()=>({data:[]})),
    sb.from('tournament_participants').select('*').then(r=>r,()=>({data:[]})),
    sb.from('bracket_cache').select('*').then(r=>r,()=>({data:[]}))
  ]);
  S.tours=ts.data||[];
  (ps.data||[]).forEach(p=>S.players[p.id]=p.nickname);
  S.encounters=es.data||[];
  (rs.data||[]).forEach(r=>{(S.results[r.tournament_id]=S.results[r.tournament_id]||[]).push(r)});
  (pa.data||[]).forEach(p=>{(S.parts[p.tournament_id]=S.parts[p.tournament_id]||[]).push(p)});
  (bc.data||[]).forEach(c=>{S.cache[c.tournament_id]=c.json});
  // default landing = «Все сетки» index
  S.view='all';S.cur=null;
  renderTourbar();
  renderFmtTabs();
  render();
}

function openTour(t){S.cur=t;S.view='tour';S.fmt='bracket';
  $('fmtrow').querySelectorAll('.fmt-btn').forEach(x=>x.classList.toggle('active',x.dataset.fmt==='bracket'));
  renderTourbar();render();}
function openAll(){S.view='all';renderTourbar();render();}

// left «Все сетки» + (when inside a tournament) active tournament tab on the right
function renderTourbar(){
  const inTour=S.view==='tour'&&S.cur;
  let right='';
  if(inTour){
    const t=S.cur,st=t.status||'finished';
    const lbl={live:'LIVE',upcoming:'СКОРО',finished:'ЗАВЕРШЁН'}[st]||'';
    // дату показываем только если задана (иначе под бейджем висел «—»)
    const sub=t.event_date?`<span class="tt-sub">${fmtRange(t)}</span>`:'';
    right=`<div class="spacer"></div>
      <div class="tour-tab"><span class="tt-main">${esc(t.name)}<span class="tt-badge ${st}">${lbl}</span></span>${sub}</div>`;
  }
  // рядом с «Все сетки» — кнопка-переход на актуальный турнир (через разделитель);
  // показываем всегда, в т.ч. при открытой сетке, чтобы актуальный турнир не пропадал
  let quick='';
  {
    const c=curTour();
    if(c){
      const open=inTour&&S.cur&&c.id==S.cur.id;
      quick=`<div class="tr-div"></div>
      <button class="cur-btn ${open?'active':''}" id="curBtn" title="Открыть актуальный турнир">
        <span class="cb-dot ${c.status==='live'?'on':''}"></span><span class="cb-tx">${esc(c.name)}</span>
      </button>`;
    }
  }
  $('tourrow').innerHTML=`
    <button class="all-btn ${S.view==='all'?'active':''}" id="allBtn">
      <svg class="ab-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <span class="ab-tx">Все сетки</span>
    </button>${quick}${right}`;
  $('allBtn').onclick=openAll;
  const cb=$('curBtn');if(cb)cb.onclick=()=>{const c=curTour();if(c)openTour(c);};
  $('fmtrow').hidden=!inTour;
}
function renderFmtTabs(){
  $('fmtrow').querySelectorAll('.fmt-btn').forEach(b=>b.onclick=()=>{
    S.fmt=b.dataset.fmt;
    $('fmtrow').querySelectorAll('.fmt-btn').forEach(x=>x.classList.toggle('active',x===b));
    render();
  });
}

function render(){
  const sp=$('spinner');if(sp)sp.style.display='none';
  if(S.view==='all'){$('tmeta').style.display='none';return renderAll();}
  const t=S.cur;
  if(!t){return openAll();}
  renderMeta(t);
  if(S.fmt==='results') return renderResults(t);
  renderBracket(t);
}

// «Все сетки» — tournaments index (Challonge-style list)
function renderAll(){
  if(!S.tours.length){$('content').innerHTML='<div class="panel"><h3>Нет турниров</h3></div>';return;}
  const order={live:0,upcoming:1,finished:2};
  const rows=S.tours.slice().sort((a,b)=>(order[a.status]??3)-(order[b.status]??3));
  const fmtLbl=t=>t.bracket_type==='DE'?'Double Elim':t.bracket_type==='SE'?'Single Elim':(t.bracket_type||'—');
  $('content').innerHTML=`<div class="idx-wrap">
    <div class="idx-h">Все сетки</div>
    <div class="idx-sub">Турнирные сетки Nexus Shiyu · нажми на турнир, чтобы открыть его сетку</div>
    <div class="idx-tbl">
      <div class="idx-head">
        <div>Название</div><div>Формат</div><div>Участники</div><div>Даты проведения</div><div>Прогресс</div>
      </div>
      ${rows.map(t=>`
        <div class="idx-row${(t.status||'')==='live'?' live-row':''}" data-id="${t.id}">
          <div class="ir-name"><span class="ir-thumb">${esc((t.name||'?').slice(0,2).toUpperCase())}</span>${esc(t.name)}${(t.status||'')==='live'?'<span class="live-dot" title="Идёт сейчас"></span>':''}</div>
          <div class="idx-cell"><span class="fmt-pill">${esc(fmtLbl(t))}</span></div>
          <div class="idx-cell mut">${partCount(t.id)||t.expected_players||'—'}</div>
          <div class="idx-cell mut">${fmtRange(t)}</div>
          <div class="idx-cell">${progHTML(tourProgress(t.id))}</div>
        </div>`).join('')}
    </div>
  </div>`;
  $('content').querySelectorAll('.idx-row').forEach(r=>r.onclick=()=>openTour(S.tours.find(t=>t.id==r.dataset.id)));
}

function renderMeta(t){
  const slug=challongeSlug(t.challonge_url);
  const pr=tourProgress(t.id);
  $('tmeta').style.display='flex';
  $('tmeta').innerHTML=`
    <div class="tname">${esc(t.name)}</div>
    <span class="chip">Формат <b>${t.bracket_type==='DE'?'Double Elim':t.bracket_type==='SE'?'Single Elim':'—'}</b></span>
    <span class="chip">Дата <b>${fmtRange(t)}</b></span>
    <span class="chip" style="gap:10px">Прогресс <div class="prog" style="width:130px"><div class="bar"><div class="fill" style="width:${pr.pct}%"></div></div><span class="pln">${pr.done}/${pr.total}</span></div></span>
    ${slug?`<a class="ch-link" href="https://challonge.com/ru/${slug}" target="_blank" rel="noopener">Открыть на Challonge ↗</a>`:''}`;
}

// ---- normalized bracket model from encounters (fallback until Challonge proxy) ----
// Groups a tournament's encounters by `stage` into rounds. Challonge proxy will
// later feed the same {rounds:[{name,matches}]} shape — renderRounds stays unchanged.
function modelFromEncounters(t){
  const encs=S.encounters.filter(e=>e.tournament_id==t.id);
  if(!encs.length) return null;
  const byStage={};
  encs.forEach(e=>{const k=e.stage||'Раунд';(byStage[k]=byStage[k]||[]).push(e)});
  const ORDER=['1/8','1/4','1/2','Полуфинал','Финал','Гранд-финал','Нижняя сетка'];
  const keys=Object.keys(byStage).sort((a,b)=>{
    const ia=ORDER.findIndex(o=>a.includes(o)),ib=ORDER.findIndex(o=>b.includes(o));
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return {rounds:keys.map(k=>({name:k,matches:byStage[k].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(e=>encMatch(e))}))};
}
function encMatch(e){
  const n=id=>id?(S.players[id]||'—'):null;
  // score: count match wins within encounter is unknown here → show winner only (Bo2)
  return {
    a:{name:n(e.player1_id),win:e.winner_id&&e.winner_id===e.player1_id,seed:''},
    b:{name:n(e.player2_id),win:e.winner_id&&e.winner_id===e.player2_id,seed:''},
    played:!!e.winner_id
  };
}

function renderBracket(t){
  const slug=challongeSlug(t.challonge_url);
  // ИСТОЧНИК (гибрид): для турниров с challonge_url авторитет сетки = кэш Challonge (синк на бэке),
  // иначе фолбэк на encounters, иначе каркас.
  const ch=S.cache[t.id];
  let src='enc';
  let model=(ch&&Array.isArray(ch.rounds)&&ch.rounds.length)?(src='challonge',{rounds:ch.rounds}):modelFromEncounters(t);
  if(model&&src!=='challonge')src='enc';
  let skeleton=false;
  // нет сохранённых встреч → показываем КАРКАС по формату+числу участников
  if(!model){
    src='skeleton';
    const seeds=seedsOf(t.id);
    const n=Math.max(seeds.length,t.expected_players||0);
    model=(typeof BracketModel!=='undefined')?BracketModel.skeletonModel(t.bracket_type||'SE',n,seeds):null;
    skeleton=!!model;
  }
  if(!model){
    $('content').innerHTML=`<div class="panel">
      <h3>Сетка ещё не готова</h3>
      <p>Укажи формат и число участников турнира, чтобы показать каркас сетки.</p>
      ${slug?`<p>Пока можно открыть оригинал на Challonge:</p>
        <a class="alt" href="https://challonge.com/ru/${slug}" target="_blank" rel="noopener">Challonge / ${esc(slug)} ↗</a>`:''}
    </div>`;
    return;
  }
  const badge=src==='challonge'
    ?`<span style="display:inline-block;padding:2px 9px;border-radius:99px;background:linear-gradient(90deg,#ff3b6b,#ff8a5b);color:#fff;font-size:11px;font-weight:700;letter-spacing:.4px">CHALLONGE · авто-синк${ch.fetched_at?' · '+fmtDate(ch.fetched_at):''}</span>`
    :src==='enc'?`<span style="display:inline-block;padding:2px 9px;border-radius:99px;background:#1a1d27;border:1px solid var(--border);color:var(--sub);font-size:11px;font-weight:600">Ручной ввод</span>`:'';
  const note=(badge||skeleton)?`<div style="max-width:1080px;margin:0 auto;padding:16px 28px 0;color:var(--sub);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${badge}${skeleton?`<span>Предварительный каркас сетки${seedsOf(t.id).length?' (участники по посеву)':' — участники появятся по мере заполнения'}.</span>`:''}</div>`:'';
  $('content').innerHTML=note+`<div class="bracket-wrap">${renderRounds(model.rounds)}</div>`;
}

function renderRounds(rounds){
  // Challonge нумерует встречи сквозно по порядку раундов (1,2,3…) — слева от карточки.
  let id=0;
  return `<div class="bracket">`+rounds.map(r=>`
    <div class="bround">
      <div class="bround-h">${esc(r.name)}</div>
      ${r.matches.map(m=>matchHTML(m,++id)).join('')}
    </div>`).join('')+`</div>`;
}
function matchHTML(m,id){
  return `<div class="match ${m.played?'played':''}">
    ${id?`<span class="m-id">${id}</span>`:''}
    ${seedHTML(m.a,m.played)}${seedHTML(m.b,m.played)}</div>`;
}
function seedHTML(s,played){
  if(s&&s.bye) return `<div class="seed tbd"><span class="sd"></span><span class="av" style="border-style:none"></span><span class="nm" style="color:#44444c">BYE</span><span class="sc"></span></div>`;
  if(!s||!s.name) return `<div class="seed tbd"><span class="sd"></span><span class="av"></span><span class="nm">TBD</span><span class="sc"></span></div>`;
  // победитель → win; в сыгранной встрече проигравший → серый; иначе (каркас) — нейтрально
  const cls=s.win?'win':(played&&s.name!=='—'?'lose':'');
  const init=(s.name||'?').replace(/[^A-Za-zА-Яа-я0-9$]/g,'').slice(0,2).toUpperCase()||'—';
  const sl=(s.name||'').trim().toLowerCase();
  return `<div class="seed ${cls}">
    <span class="sd">${s.seed||''}</span>
    <span class="av"><img src="web/players/${esc(sl)}.webp" alt="" onerror="this.remove()">${init}</span>
    <span class="nm">${esc(s.name)}</span>
    <span class="sc">${s.win?'✓':''}</span></div>`;
}

// плашки-обзор сыгранных встреч (только добавленные в статистику = с победителем), 4 в ряд
function encReviewCards(t){
  const encs=S.encounters.filter(e=>e.tournament_id==t.id&&e.winner_id)
    .sort((a,b)=>(a.sort_order??1e9)-(b.sort_order??1e9));
  if(!encs.length)return'';
  const row=(name,win)=>`<div class="rev-row ${win?'win':''}"><span class="rev-nm">${esc(name||'—')}</span>${win?'<span class="rev-w">✓</span>':''}</div>`;
  return`<div class="rev-wrap">
    <div class="rev-h">Обзор встреч</div>
    <div class="rev-grid">${encs.map(e=>`
      <div class="rev-card">
        ${e.stage?`<div class="rev-stage">${esc(e.stage)}</div>`:''}
        ${row(S.players[e.player1_id],e.winner_id===e.player1_id)}
        ${row(S.players[e.player2_id],e.winner_id===e.player2_id)}
      </div>`).join('')}</div>
  </div>`;
}
function renderResults(t){
  const rs=(S.results[t.id]||[]).slice().sort((a,b)=>(a.place||99)-(b.place||99));
  const cards=encReviewCards(t);
  if(!rs.length){
    $('content').innerHTML=`<div class="panel"><h3>Результаты не заполнены</h3>
      <p>Места и призовые появятся после завершения турнира — их подтянет синк с Challonge (final_rank) или ручной ввод в админке.</p></div>${cards}`;
    return;
  }
  $('content').innerHTML=`<div class="rtbl">`+rs.map(r=>{
    const g=r.place<=3?'g'+r.place:'';
    return `<div class="rrow">
      <span class="plc ${g}">${r.place||'—'}</span>
      <span class="rnm">${esc(S.players[r.player_id]||'—')}</span>
      ${r.prize?`<span class="rprz">${Number(r.prize).toLocaleString('ru')} ₽</span>`:''}</div>`;
  }).join('')+`</div>`+cards;
}

// ===== bracket connectors + state nodes (additive overlay — observes render output,
//        does NOT modify renderRounds/modelFromEncounters/boot) =====
(function(){
  const NS='http://www.w3.org/2000/svg';
  const rc=(el,base)=>{const r=el.getBoundingClientRect();return{l:r.left-base.left,r:r.right-base.left,cy:(r.top+r.bottom)/2-base.top};};
  const mstate=m=>m.classList.contains('played')?'done':(m.querySelector('.seed.tbd')?'future':'live');
  function diamond(x,y,st){const s=6.5,p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M${x} ${y-s}L${x+s} ${y}L${x} ${y+s}L${x-s} ${y}Z`);
    p.setAttribute('class','node '+st);return p;}
  function tagRounds(rounds){
    rounds.forEach(r=>{
      const h=r.querySelector('.bround-h'),t=((h&&h.textContent)||'').trim().toLowerCase();
      r.classList.remove('br-lower','br-gf');
      if(/нижн|lower|loser/.test(t))r.classList.add('br-lower');
      else if(/гранд|grand|finale/.test(t)||t==='финал')r.classList.add('br-gf');
    });
  }
  function paintOne(br){
    br.querySelectorAll(':scope > svg.bconn').forEach(s=>s.remove());
    const rounds=[...br.querySelectorAll(':scope > .bround')];
    if(!rounds.length)return;
    tagRounds(rounds);
    const base=br.getBoundingClientRect();
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('class','bconn');
    const mr=rounds.map(r=>[...r.querySelectorAll(':scope > .match')]);
    const lastIdx=rounds.length-1;
    // links between adjacent rounds
    for(let ri=0;ri<lastIdx;ri++){
      const cur=mr[ri],nxt=mr[ri+1];
      if(!cur.length||!nxt.length)continue;
      cur.forEach((m,i)=>{
        let ti;
        if(nxt.length===cur.length)ti=i;
        else if(nxt.length===Math.ceil(cur.length/2))ti=Math.floor(i/2);
        else ti=Math.min(nxt.length-1,Math.floor(i*nxt.length/cur.length));
        const tgt=nxt[ti];if(!tgt)return;
        const a=rc(m,base),b=rc(tgt,base),midx=a.r+(b.l-a.r)/2;
        const p=document.createElementNS(NS,'path');
        p.setAttribute('d',`M${a.r} ${a.cy}H${midx}V${b.cy}H${b.l}`);
        p.setAttribute('class','link'+(mstate(m)==='future'?' dim':''));
        svg.appendChild(p);
      });
    }
    // state diamonds: output (right) when a next round exists; junction (left) when fed
    mr.forEach((arr,ri)=>arr.forEach(m=>{
      const a=rc(m,base),st=mstate(m);
      if(ri<lastIdx)svg.appendChild(diamond(a.r,a.cy,st));
      if(ri>0)svg.appendChild(diamond(a.l,a.cy,st));
    }));
    br.prepend(svg);
    // legend (once per bracket-wrap, only when there are connections to explain)
    const wrap=br.closest('.bracket-wrap');
    if(rounds.length>1&&wrap&&!wrap.querySelector('.blegend')){
      const lg=document.createElement('div');lg.className='blegend';
      lg.innerHTML='<span><i class="done"></i>матч завершён</span><span><i class="live"></i>активный матч</span><span><i class="future"></i>будущий матч</span>';
      wrap.appendChild(lg);
    }
  }
  let busy=false;
  function paint(){busy=true;document.querySelectorAll('.bracket').forEach(paintOne);busy=false;}
  let t;const schedule=()=>{clearTimeout(t);t=setTimeout(paint,60);};
  const c=document.getElementById('content');
  if(c)new MutationObserver(()=>{if(!busy)schedule();}).observe(c,{childList:true});
  window.addEventListener('resize',schedule);
  window.addEventListener('load',schedule);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
})();

boot().catch(e=>{console.error(e);$('content').innerHTML='<div class="panel"><h3>Ошибка загрузки</h3><p>'+esc(e.message)+'</p></div>';});
