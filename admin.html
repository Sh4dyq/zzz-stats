<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZZZ Stats — Управление</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#08090d;--card:#0f1118;--border:#1c1f2e;--accent:#f5c842;--text:#e8eaf0;--sub:#7b7f96}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex}
  input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{
    background:#0d0f18;border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:8px 12px;font-family:'Rajdhani',sans-serif;font-size:14px;width:100%;outline:none;
  }
  input:focus,select:focus{border-color:#3b4260;}
  label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px;letter-spacing:.04em}
  .btn{border:none;border-radius:6px;padding:8px 18px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:.15s}
  .btn-y{background:var(--accent);color:#000}.btn-y:hover{background:#ffd235}
  .btn-g{background:#1c1f2e;color:var(--text);border:1px solid var(--border)}.btn-g:hover{background:#252840}
  .btn-r{background:none;color:#f87171;border:1px solid #4b1c1c;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer}.btn-r:hover{background:#4b1c1c}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
  .nav-a{display:block;padding:8px 12px;border-radius:6px;font-size:14px;color:var(--sub);text-decoration:none;cursor:pointer;font-weight:500;letter-spacing:.03em}
  .nav-a:hover,.nav-a.on{background:#1c1f2e;color:var(--text)}
  .row-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
  .badge-s{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#451a03;color:#fbbf24}
  .badge-a{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:#1c1f2e;color:var(--sub)}
  .pick-row,.ban-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#0d0f18;border:1px solid var(--border);border-radius:6px;padding:8px 10px}
  .pick-row select,.ban-row select{flex:1;min-width:140px}
  .sm-sel{min-width:auto!important;width:auto!important;flex:none!important}
  .cb-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
  input[type=checkbox]{width:auto;accent-color:var(--accent)}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .alert{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px}
  .alert-ok{background:#052e16;color:#4ade80;border:1px solid #14532d}
  .alert-err{background:#2b0a0a;color:#f87171;border:1px solid #7f1d1d}
  h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:.04em}
  h4{font-size:14px;font-weight:600;color:var(--text);margin:16px 0 10px;letter-spacing:.03em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .space-y>*+*{margin-top:8px}
  /* кастомный дропдаун с иконками */
  .icsel{position:relative;width:100%}
  .icsel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0f1118;border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 10px;font-family:'Rajdhani',sans-serif;font-size:14px;cursor:pointer}
  .icsel-btn:hover{border-color:var(--sub)}
  .icsel-cur{display:flex;align-items:center;gap:8px;min-height:18px}
  .icsel-arr{color:var(--sub);font-size:11px}
  .icsel-list{position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;background:#12141d;border:1px solid var(--border);border-radius:6px;padding:4px;display:none;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .icsel-list.open{display:block}
  .icsel-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;color:var(--text)}
  .icsel-opt:hover{background:#1c1f2e}
  .icsel-opt.sel{background:#1c1f2e;color:var(--accent)}
  .icsel-ic{display:inline-flex;align-items:center}
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar" style="display:none;width:200px;background:#0b0d14;border-right:1px solid var(--border);flex-direction:column;min-height:100vh">
  <div style="padding:16px;border-bottom:1px solid var(--border)">
    <div style="font-size:16px;font-weight:700;color:var(--accent);letter-spacing:.06em">ZZZ STATS</div>
    <div style="font-size:11px;color:var(--sub);margin-top:2px" id="user-email"></div>
  </div>
  <nav style="padding:8px;flex:1">
    <a class="nav-a" data-page="dashboard">📊 Дашборд</a>
    <a class="nav-a" data-page="tournaments">🏆 Турниры</a>
    <a class="nav-a" data-page="characters">🎮 Персонажи</a>
    <a class="nav-a" data-page="signatures">⚙️ Амплификаторы</a>
    <a class="nav-a" data-page="players">👤 Игроки</a>
    <a class="nav-a" data-page="matches">⚔️ Матчи</a>
  </nav>
  <div style="padding:12px;border-top:1px solid var(--border)">
    <button class="btn btn-g" style="width:100%;font-size:12px;padding:6px" onclick="signOut()">Выйти</button>
    <a href="index.html" style="display:block;text-align:center;font-size:11px;color:var(--sub);text-decoration:none;margin-top:8px">← На сайт</a>
  </div>
</aside>

<!-- Main -->
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">

  <!-- Login -->
  <div id="login-screen" style="flex:1;display:flex;align-items:center;justify-content:center">
    <div class="card" style="width:340px">
      <div style="font-size:22px;font-weight:700;color:var(--accent);margin-bottom:20px;letter-spacing:.06em">ZZZ STATS</div>
      <div id="auth-msg"></div>
      <div style="margin-bottom:12px"><label>Email</label><input id="a-email" type="email" placeholder="your@email.com"></div>
      <div style="margin-bottom:16px"><label>Пароль</label><input id="a-pass" type="password"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-y" style="flex:1" onclick="signIn()">Войти</button>
        <button class="btn btn-g" style="flex:1" onclick="signUp()">Регистрация</button>
      </div>
      <button class="btn btn-g" style="width:100%;margin-top:10px;font-size:13px" onclick="enableDevPreview()">Dev preview</button>
    </div>
  </div>

  <!-- Admin area -->
  <div id="admin-area" style="display:none;flex:1;overflow:auto;flex-direction:column">
    <div style="border-bottom:1px solid var(--border);padding:12px 24px">
      <span id="page-title" style="font-size:16px;font-weight:600;letter-spacing:.04em">Дашборд</span>
    </div>
    <div id="page-content" style="padding:24px;width:100%"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="web/icons.js"></script>
<script src="web/core.js"></script>
<script src="web/characters.js"></script>
<script src="web/signatures.js"></script>
<script src="web/players.js"></script>
<script src="web/tournaments.js"></script>
<script src="web/matches.js"></script>
<script>
function enableDevPreview(){
  window.DEV_PREVIEW=true;
  D.chars=[{id:'c1',name:'Ellen Joe',role:'atk',rarity:'S'}];
  D.sigs=[{id:'s1',name:'Deep Sea Visitor',character_id:'c1'}];
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-area').style.display='flex';
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('user-email').textContent='dev@local';
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.toggle('on',a.dataset.page==='signatures'));
  document.getElementById('page-title').textContent='Амплификаторы (Dev)';
  if(typeof pgSignatures==='function')pgSignatures();
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>{
    const isDev=location.search.includes('dev=1')||location.protocol==='file:'||location.hostname==='localhost';
    if(isDev)setTimeout(enableDevPreview,100);
  });
}else{
  const isDev=location.search.includes('dev=1')||location.protocol==='file:'||location.hostname==='localhost';
  if(isDev)setTimeout(enableDevPreview,100);
}
</script>
</body>
</html>
