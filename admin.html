<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nexus Stats — Управление</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Saira+Condensed:ital,wght@0,800;0,900;1,900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;--card:#161618;--panel-2:#1c1c20;--panel-3:#242429;
    --border:#26262c;--line:rgba(255,255,255,.07);
    --accent:#ff1f44;--pink:#ec1862;--grad:linear-gradient(95deg,#ff1f44,#ec1862);
    --gold:#f5c842;--lime:#c4f500;--purple:#a970ff;--red:#ff1f44;--win:#46d369;
    --text:#f3f3f5;--sub:#8a8a93;
    --field:#0d0f18;--field-2:#12141d;
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:rgba(255,31,68,.3);color:#fff}
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(620px 420px at 16% -8%,rgba(255,31,68,.10),transparent 60%),
               radial-gradient(560px 460px at 100% 0%,rgba(169,112,255,.06),transparent 55%)}
  body>*{position:relative;z-index:1}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:#2c2c33;border:2px solid var(--bg);border-radius:8px}
  *::-webkit-scrollbar-thumb:hover{background:#3a3a44}
  input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],input[type=url],select,textarea{
    background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:9px 12px;font-family:'Rajdhani',sans-serif;font-size:14px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
  input::placeholder,textarea::placeholder{color:#54545e}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,31,68,.14)}
  label{font-size:11px;color:var(--sub);display:block;margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  code{font-family:'JetBrains Mono',monospace;font-size:.86em;background:var(--field-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
  .btn{border:none;border-radius:8px;padding:9px 18px;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.04em;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;line-height:1}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-y{background:var(--grad);color:#fff;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 4px 14px rgba(255,31,68,.22)}
  .btn-y:hover{filter:brightness(1.1);box-shadow:0 6px 20px rgba(255,31,68,.34)}
  .btn-y:active{transform:translateY(1px)}
  .btn-g{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .btn-g:hover{background:var(--panel-3);border-color:#3c3c46}
  .btn-r{background:none;color:#f87171;border:1px solid #4b1c1c;border-radius:7px;padding:5px 9px;font-size:13px;cursor:pointer;transition:.15s}
  .btn-r:hover{background:#4b1c1c;color:#fecaca}
  .card{background:linear-gradient(180deg,#17171a,#141416);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.28)}
  .nav-a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;font-size:14px;color:var(--sub);text-decoration:none;cursor:pointer;font-weight:600;letter-spacing:.02em;position:relative;transition:.15s}
  .nav-a svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;opacity:.9}
  .nav-a:hover{background:var(--panel-2);color:var(--text)}
  .nav-a.on{background:linear-gradient(95deg,rgba(255,31,68,.16),rgba(236,24,98,.05));color:#fff}
  .nav-a.on::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:2px;background:var(--grad)}
  .nav-a.on svg{color:var(--accent);opacity:1}
  .nav-group{font-size:10px;font-weight:700;letter-spacing:.14em;color:#5a5a63;text-transform:uppercase;padding:6px 12px 4px;margin-top:10px}
  .row-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .row-item:hover{border-color:#3a3a44;background:#1a1a1e}
  .badge-s{font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:11px;font-weight:900;padding:1px 8px;background:linear-gradient(180deg,#f8d36a,#d99a16);color:#2a1c00;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
  .badge-a{font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:11px;font-weight:900;padding:1px 8px;background:var(--panel-3);color:var(--sub);clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
  .ms-tag{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--gold);background:#241f0e;border:1px solid #4a3d12;border-radius:5px;padding:1px 6px}
  .pick-row,.ban-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--field);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
  .pick-row select,.ban-row select{flex:1;min-width:140px}
  .sm-sel{min-width:auto!important;width:auto!important;flex:none!important}
  .cb-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
  input[type=checkbox]{width:auto;accent-color:var(--accent)}
  .spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .alert-ok{background:#052e16;color:#4ade80;border:1px solid #14532d}
  .alert-err{background:#2b0a0a;color:#f87171;border:1px solid #7f1d1d}
  h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
  h3::before{content:"";width:4px;height:17px;background:var(--grad);border-radius:1px;transform:skewX(-12deg);flex-shrink:0}
  h4{font-size:12px;font-weight:700;color:var(--sub);margin:16px 0 10px;letter-spacing:.08em;text-transform:uppercase}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
  .space-y>*+*{margin-top:8px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border);padding:14px 28px;background:linear-gradient(180deg,rgba(22,22,24,.6),transparent)}
  .topbar .eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#5a5a63}
  .page-title{display:block;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.01em;line-height:1.05;margin-top:1px}
  .dev-pill{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  /* кастомный дропдаун с иконками */
  .icsel{position:relative;width:100%}
  .icsel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--field);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 11px;font-family:'Rajdhani',sans-serif;font-size:14px;cursor:pointer;transition:border-color .15s}
  .icsel-btn:hover{border-color:#3c3c46}
  .icsel-cur{display:flex;align-items:center;gap:8px;min-height:18px}
  .icsel-arr{color:var(--sub);font-size:11px}
  .icsel-list{position:absolute;z-index:50;top:calc(100% + 4px);left:0;right:0;background:var(--field-2);border:1px solid var(--border);border-radius:8px;padding:4px;display:none;max-height:260px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.5)}
  .icsel-list.open{display:block}
  .icsel-opt{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:14px;color:var(--text)}
  .icsel-opt:hover{background:var(--panel-3)}
  .icsel-opt.sel{background:rgba(255,31,68,.12);color:var(--accent)}
  .icsel-ic{display:inline-flex;align-items:center}

  /* — collapsible panel — */
  details.panel{background:linear-gradient(180deg,#17171a,#141416);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.28);margin-bottom:16px;overflow:hidden}
  details.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:15px 20px;font-weight:700;font-size:15px;letter-spacing:.02em;user-select:none;color:var(--text)}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary::before{content:"";width:4px;height:17px;background:var(--grad);border-radius:1px;transform:skewX(-12deg);flex-shrink:0}
  details.panel>summary .chev{margin-left:auto;color:var(--sub);transition:transform .2s;font-size:12px}
  details.panel[open]>summary .chev{transform:rotate(180deg)}
  details.panel[open]>summary{border-bottom:1px solid var(--border)}
  details.panel .panel-body{padding:18px 20px 20px}

  /* — search field — */
  .search{position:relative;margin-bottom:14px;max-width:340px}
  .search input{padding-left:34px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--sub);pointer-events:none}

  /* — compact card grid (персонажи / амплификаторы) — */
  .gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .gcard{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;transition:border-color .15s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.16)}
  .gcard:hover{border-color:#3a3a44;background:#1a1a1e}
  .gc-main{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
  .gc-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .gc-sub{font-size:12px;color:var(--sub);white-space:nowrap}
  .gc-acts{display:flex;gap:5px;flex-shrink:0}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--sub);cursor:pointer;transition:.15s;font-size:13px;padding:0;line-height:1}
  .icon-btn:hover{background:var(--panel-3);color:var(--text);border-color:#3c3c46}
  .icon-btn.danger:hover{background:#4b1c1c;color:#fecaca;border-color:#4b1c1c}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:12px;align-items:start}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .pcard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px 13px;transition:border-color .15s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .pcard:hover{border-color:#3a3a44;background:#1a1a1e}
  .pc-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;font-style:italic;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(135deg,#2a2a30,#1a1a1e);border:1px solid var(--border)}
  .pc-body{flex:1;min-width:0}
  .pc-nick{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pc-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .pc-meta b{color:var(--gold);font-weight:600}

  /* — content tables (косты) — */
  #page-content table{border-collapse:collapse;width:100%}
  #page-content thead th{background:#101015}
  #page-content tbody tr:hover{background:rgba(255,255,255,.025)}

  /* — count chip / toolbar — */
  .count-chip{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub);background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .listbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

  /* — tournament card — */
  .tcard{background:linear-gradient(180deg,#17171a,#141416);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.2);transition:border-color .15s}
  .tcard:hover{border-color:#3a3a44}
  .tcard-top{display:flex;align-items:center;gap:11px}
  .tcard-info{flex:1;min-width:0}
  .tcard-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard-name span{color:var(--red);margin-right:5px}
  .tcard-top select{width:auto;max-width:180px;flex-shrink:0;font-size:12px}
  .tcard-meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tcard-acts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
  .tbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;transition:.15s}
  .tbtn:hover{background:var(--panel-3);border-color:#3c3c46}
  .tbtn svg{width:15px;height:15px;stroke:currentColor;opacity:.85}
</style>
</head>

    <div style="display:flex;align-items:center;gap:9px">
      <div style="font-family:'Saira Condensed',sans-serif;font-style:italic;font-size:20px;font-weight:900;letter-spacing:.02em;line-height:1;white-space:nowrap"><span style="background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em">Nexus</span> <span style="color:#fff">Stats</span></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--accent);border:1px solid rgba(255,31,68,.4);border-radius:4px;padding:1px 5px;text-transform:uppercase;flex-shrink:0">admin</span>

    <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="user-email"></div>

    <a class="nav-a" data-page="players"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"></path></svg><span>Игроки</span></a>
    <a class="nav-a" data-page="weights"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="4" x2="6" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line><line x1="18" y1="4" x2="18" y2="20"></line><circle cx="6" cy="9" r="2" fill="var(--bg)"></circle><circle cx="12" cy="14" r="2" fill="var(--bg)"></circle><circle cx="18" cy="8" r="2" fill="var(--bg)"></circle></svg><span>Аналитика</span></a>
    <div class="nav-group">Соревнования</div>
    <a class="nav-a" data-page="tournaments"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"></path><path d="M7 5.5H4.5V7a2.5 2.5 0 0 0 2.5 2.5"></path><path d="M17 5.5h2.5V7a2.5 2.5 0 0 1-2.5 2.5"></path><path d="M12 13v3"></path><path d="M8.5 20h7l-.7-3.2a1 1 0 0 0-1-.8H10.2a1 1 0 0 0-1 .8Z"></path></svg><span>Турниры</span></a>

  </nav>
  <div style="padding:12px;border-top:1px solid var(--border)">
    <button class="btn btn-g" style="width:100%;font-size:13px;padding:8px" onclick="signOut()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>Выйти</button>
    <a href="statistics.html" style="display:block;text-align:center;font-size:11px;color:var(--sub);text-decoration:none;margin-top:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.05em">← на сайт</a>
  </div>
</aside>

<!-- Main -->
<div style="flex:1;display:flex;flex-direction:column;overflow:hidden">

  <!-- Login -->
  <div id="login-screen" style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
    <div class="card" style="width:360px;padding:28px">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// cache-busting: всегда грузим свежие web/*.js (без необходимости хард-рефреша).
// document.write сохраняет порядок и синхронность загрузки.
// predict/synergy/draft-sim — боевые движки: калибровка пар/трио зовёт Synergy.score/compPenalty напрямую (единый источник).
['web/icons.js','web/core.js','web/bracket-model.js','web/bracket-engine.js','web/bracket-view.js','web/characters.js','web/signatures.js','web/players.js','web/roster-import.js','web/tournaments.js','web/draft-import.js','web/matches.js','web/predict.js','web/synergy.js','web/draft-sim.js','web/weights.js']
  .forEach(function(s){document.write('<script src="'+s+'?v='+Date.now()+'"><\/script>');});
</script>
<script>
function enableDevPreview(){
  window.DEV_PREVIEW=true;
  D.chars=[{id:'c1',name:'Ellen Joe',role:'atk',rarity:'S'}];
  D.sigs=[{id:'s1',name:'Deep Sea Visitor',character_id:'c1'}];
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-area').style.display='flex';
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('user-email').textContent='dev@local';
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.toggle('on',a.dataset.page==='signatures'));
  document.getElementById('page-title').textContent='Амплификаторы (Dev)';
  if(typeof pgSignatures==='function')pgSignatures();
}
// Dev-превью самого драфт-борда (без логина/Supabase): мокаем данные и открываем матч.
function devDraft(){
  window.DEV_PREVIEW=true;
  const NAMES=['Yanagi','Lucy','Lycaon','Zhao Hua','Seed','Astra','Vivian','Miyabi','Ellen','Nicole','Soukaku','Promela','Yidhari','Aria','Hugo','Burnice','Caesar','Anby'];
  D.chars=NAMES.map((n,i)=>({id:'c'+i,name:n,role:['atk','stun','sup','ano'][i%4],rarity:i%5===0?'A':'S'}));
  D.sigs=D.chars.map(c=>({id:'s'+c.id,name:c.name+' Sig',character_id:c.id}));
  D.players=[{id:'p1',nickname:'HANAMORI'},{id:'p2',nickname:'KAZUTO'}];
  // мок-драфт: заполняем все слоты, чтобы видеть портреты/минскейпы/амплификаторы/рестарты/таймеры
  const tpl=DRAFT_TEMPLATE('p1','p2');
  const bans=tpl.filter(s=>s.type==='ban').map((s,i)=>({ban_order:s.n,player_id:s.pid,character_id:'c'+i}));
  const picks=tpl.filter(s=>s.type==='pick').map((s,i)=>({pick_order:s.n,player_id:s.pid,character_id:'c'+(i+6),mindscape:[0,6,0,1][i%4],has_signature:i%2===0,team_slot:1,is_fp:s.pid==='p1'}));
  window.DEV_MATCH={id:'dev-m',is_draw:false,winner_id:null,player1_timer_sec:208,player2_timer_sec:221,player1_restarts:2,player2_restarts:0,picks,bans};
  document.getElementById('login-screen').style.display='none';
  document.getElementById('admin-area').style.display='flex';
  document.getElementById('sidebar').style.display='flex';
  document.getElementById('user-email').textContent='dev@local';
  document.querySelectorAll('.nav-a').forEach(a=>a.classList.toggle('on',a.dataset.page==='matches'));
  openMatch('dev-enc',1,'p1','p2');
}
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>{
    const isDev=location.search.includes('dev=1')||location.protocol==='file:'||location.hostname==='localhost';
    if(isDev)setTimeout(enableDevPreview,100);
  });
}else{
  const isDev=location.search.includes('dev=1')||location.protocol==='file:'||location.hostname==='localhost';
  if(isDev)setTimeout(enableDevPreview,100);
}
</script>
